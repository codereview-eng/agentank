<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgenTank — AI 脚本坦克对战（单文件版）</title>
<style>
:root{
  --bg:#10151D; --panel:#1A212C; --panel-2:#151B25; --line:#2A3442;
  --text:#E6ECF3; --muted:#8B9AAD; --dim:#5C6B7E;
  --p1:#A3E635; --p2:#F472B6; --star:#FBBF24;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --accent:#38BDF8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}
code,pre,.mono,textarea{font-family:ui-monospace,"SF Mono",Menlo,monospace}

/* ── 顶栏 ── */
header{
  display:flex; align-items:center; gap:16px; padding:10px 20px;
  background:var(--panel-2); border-bottom:1px solid var(--line);
}
.logo{font-weight:800; font-size:18px; letter-spacing:1px}
.logo b{color:var(--p1)}
.logo span{color:var(--muted); font-weight:400; font-size:12px; margin-left:10px}
.badge{margin-left:auto; display:flex; gap:10px; align-items:center; font-size:12px}
.chip{border:1px solid var(--line); border-radius:999px; padding:2px 12px; color:var(--muted)}
.chip.rank{color:var(--star); border-color:#54431C}

/* ── 三栏 ── */
main{flex:1; display:grid; grid-template-columns:340px 1fr 300px; gap:12px; padding:12px 16px; min-height:0}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; min-height:0}
.panel h2{
  font-size:12px; color:var(--muted); font-weight:600; letter-spacing:2px;
  padding:10px 14px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px;
}
.panel h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* 左：脚本编辑器 */
#editor{
  flex:1; padding:12px 14px; border:none; outline:none; resize:none;
  background:transparent; color:#C9D6E4; font-size:12.5px; line-height:1.7;
  white-space:pre; overflow:auto; tab-size:2;
}
.err{display:none; color:var(--bad); font-size:12px; padding:8px 14px; border-top:1px solid var(--line); background:#2A1518; white-space:pre-wrap}
.err.show{display:block}
.ctrl{padding:12px 14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.row{display:flex; gap:8px; align-items:center}
select,input{
  background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  border-radius:6px; padding:6px 10px; font-size:13px; flex:1; min-width:0;
}
label{font-size:12px; color:var(--muted); width:64px; flex:none}
.btn{
  border:none; border-radius:8px; padding:10px 0; font-size:15px; font-weight:700;
  background:var(--p1); color:#1A2408; cursor:pointer; letter-spacing:4px;
}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--muted); font-weight:400; letter-spacing:1px; font-size:12px; padding:6px 0}

/* 中：竞技场 */
.arena-wrap{align-items:center; justify-content:flex-start}
.verdict{
  width:100%; padding:8px 14px; font-size:13px; display:flex; gap:14px; align-items:center;
  border-bottom:1px solid var(--line); min-height:38px;
}
.verdict .win{font-weight:700; color:var(--muted)}
.verdict .vs{color:var(--muted)}
.verdict .ref{margin-left:auto; color:var(--muted)}
.arena-scroll{flex:1; width:100%; display:flex; align-items:center; justify-content:center; min-height:0; overflow:auto}
canvas{border:1px solid var(--line); border-radius:6px; background:#0C1118; max-width:100%; max-height:100%}
.playbar{display:flex; gap:10px; align-items:center; padding:10px 18px 14px; width:100%}
.pb-btn{
  width:34px;height:30px; border:1px solid var(--line); border-radius:6px;
  background:var(--panel-2); color:var(--text); font-size:13px; cursor:pointer; flex:none;
}
.pb-btn.play{background:var(--accent); color:#062033; border:none; font-weight:700}
.track{flex:1; height:6px; border-radius:3px; background:var(--panel-2); position:relative; cursor:pointer}
.track i{position:absolute; left:0; top:0; height:100%; width:0; background:var(--accent); border-radius:3px; pointer-events:none}
.track b{position:absolute; left:0; top:-4px; width:14px; height:14px; border-radius:50%; background:var(--text); margin-left:-7px; pointer-events:none}
.tick{font-size:12px; color:var(--muted); white-space:nowrap}
.speed{display:flex; gap:4px}
.speed span{font-size:11px; padding:2px 8px; border:1px solid var(--line); border-radius:4px; color:var(--muted); cursor:pointer}
.speed .on{background:var(--panel-2); color:var(--text); border-color:var(--accent)}

/* 右：战报+天梯 */
.log{flex:1.2; overflow:auto; padding:10px 14px; font-size:12px; line-height:1.9; min-height:0}
.log .ln{opacity:.25; transition:opacity .15s}
.log .ln.on{opacity:1}
.log .t{color:var(--dim); margin-right:6px}
.log .p1{color:var(--p1)} .log .p2{color:var(--p2)}
.log .sk{color:var(--accent)} .log .st{color:var(--star)} .log .dmg{color:var(--bad)}
.log .win2{color:var(--ok); font-weight:700}
table{width:100%; border-collapse:collapse; font-size:12px}
th{color:var(--muted); font-weight:500; text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
td{padding:6px 8px; border-bottom:1px solid #1F2733; font-variant-numeric:tabular-nums}
td.r1{color:var(--star)} .elo{color:var(--accent)}
.me td{background:#1E2A1A}
.ladder-hint{padding:8px 14px; font-size:11px; color:var(--dim)}
footer{
  padding:6px 20px; border-top:1px solid var(--line); background:var(--panel-2);
  font-size:11px; color:var(--dim); display:flex; gap:24px;
}
footer .mono{color:var(--muted)}
</style>
</head>

<script>
(function () {
"use strict";
/*__ENGINE_START__*/
// ===== src/engine/rng.js =====
// 种子化 RNG：mulberry32。引擎内一切随机（地图生成、巡逻、星星补刷）都走它，保证确定性。

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function randInt(rng, n) {
  return Math.floor(rng() * n);
}

// ===== src/engine/map.js =====
// 地图：格子地形。
// wall  墙   —— 挡子弹 + 挡坦克
// dirt  土堆 —— 挡子弹，坦克可通行
// grass 草丛 —— 站入后对距离>1 的敌人隐身，不挡弹不挡身
// empty 空地


const TILE = { EMPTY: 'empty', WALL: 'wall', DIRT: 'dirt', GRASS: 'grass' };

function inBounds(map, x, y) {
  return x >= 0 && y >= 0 && x < map.width && y < map.height;
}

function tileAt(map, x, y) {
  return map.tiles[y][x];
}

function isWalkable(map, x, y) {
  return inBounds(map, x, y) && map.tiles[y][x] !== TILE.WALL;
}

function blocksBullet(tile) {
  return tile === TILE.WALL || tile === TILE.DIRT;
}

function cloneMap(m) {
  return {
    width: m.width,
    height: m.height,
    tiles: m.tiles.map((row) => row.slice()),
    spawns: m.spawns.map((s) => ({ x: s.x, y: s.y })),
    stars: m.stars.map((s) => ({ x: s.x, y: s.y })),
  };
}

// ASCII 建图（测试/自定义用）：
// '#'=墙 'D'=土堆 'g'=草丛 '*'=星星 'A'/'B'=出生点 'a'/'b'=草丛上的出生点 '.'或' '=空地
function mapFromAscii(rows) {
  const height = rows.length;
  const width = rows[0].length;
  const tiles = [];
  const stars = [];
  const spawns = [null, null];
  for (let y = 0; y < height; y++) {
    const row = [];
    for (let x = 0; x < width; x++) {
      const c = rows[y][x];
      let tile = TILE.EMPTY;
      if (c === '#') tile = TILE.WALL;
      else if (c === 'D') tile = TILE.DIRT;
      else if (c === 'g') tile = TILE.GRASS;
      else if (c === '*') stars.push({ x, y });
      else if (c === 'A') spawns[0] = { x, y };
      else if (c === 'B') spawns[1] = { x, y };
      else if (c === 'a') { spawns[0] = { x, y }; tile = TILE.GRASS; }
      else if (c === 'b') { spawns[1] = { x, y }; tile = TILE.GRASS; }
      row.push(tile);
    }
    tiles.push(row);
  }
  if (!spawns[0] || !spawns[1]) throw new Error('mapFromAscii: 需要 A/B 出生点');
  return { width, height, tiles, spawns, stars };
}

function connected(map, from, targets) {
  const { width: W, height: H } = map;
  const seen = new Uint8Array(W * H);
  const q = [from.y * W + from.x];
  seen[q[0]] = 1;
  for (let qi = 0; qi < q.length; qi++) {
    const c = q[qi];
    const cx = c % W;
    const cy = (c - cx) / W;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx;
      const ny = cy + dy;
      if (!isWalkable(map, nx, ny)) continue;
      const nc = ny * W + nx;
      if (!seen[nc]) { seen[nc] = 1; q.push(nc); }
    }
  }
  return targets.every((t) => seen[t.y * W + t.x] === 1);
}

// 点对称随机地图：公平（两侧地形镜像），带连通性校验，失败重试，最终退化为空旷图。
function generateMap(rng, { width = 17, height = 17, starCount = 6 } = {}) {
  for (let attempt = 0; attempt < 30; attempt++) {
    const tiles = Array.from({ length: height }, (_, y) =>
      Array.from({ length: width }, (_, x) =>
        x === 0 || y === 0 || x === width - 1 || y === height - 1 ? TILE.WALL : null,
      ),
    );
    for (let y = 1; y < height - 1; y++) {
      for (let x = 1; x < width - 1; x++) {
        if (tiles[y][x] !== null) continue;
        const r = rng();
        const tile = r < 0.08 ? TILE.WALL : r < 0.16 ? TILE.DIRT : r < 0.28 ? TILE.GRASS : TILE.EMPTY;
        tiles[y][x] = tile;
        const my = height - 1 - y;
        const mx = width - 1 - x;
        if (tiles[my][mx] === null) tiles[my][mx] = tile;
      }
    }
    const spawns = [{ x: 1, y: 1 }, { x: width - 2, y: height - 2 }];
    for (const s of spawns) {
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const nx = s.x + dx;
          const ny = s.y + dy;
          if (nx >= 1 && ny >= 1 && nx <= width - 2 && ny <= height - 2) tiles[ny][nx] = TILE.EMPTY;
        }
      }
    }
    const map = { width, height, tiles, spawns, stars: [] };
    const half = Math.floor(starCount / 2);
    let guard = 0;
    while (map.stars.length < half * 2 && guard++ < 500) {
      const x = 1 + randInt(rng, width - 2);
      const y = 1 + randInt(rng, height - 2);
      const mx = width - 1 - x;
      const my = height - 1 - y;
      if (x === mx && y === my) continue;
      if (tiles[y][x] === TILE.WALL || tiles[my][mx] === TILE.WALL) continue;
      const nearSpawn = spawns.some((s) => Math.abs(s.x - x) + Math.abs(s.y - y) <= 2 || Math.abs(s.x - mx) + Math.abs(s.y - my) <= 2);
      if (nearSpawn) continue;
      if (map.stars.some((s) => (s.x === x && s.y === y) || (s.x === mx && s.y === my))) continue;
      map.stars.push({ x, y }, { x: mx, y: my });
    }
    if (map.stars.length === half * 2 && connected(map, spawns[0], [spawns[1], ...map.stars])) {
      return map;
    }
  }
  // 退化兜底：空旷图 + 固定对称星星（仍确定性）
  const tiles = Array.from({ length: height }, (_, y) =>
    Array.from({ length: width }, (_, x) =>
      x === 0 || y === 0 || x === width - 1 || y === height - 1 ? TILE.WALL : TILE.EMPTY,
    ),
  );
  const cx = Math.floor(width / 2);
  const cy = Math.floor(height / 2);
  const stars = [
    { x: cx - 3, y: cy }, { x: cx + 3, y: cy },
    { x: cx, y: cy - 3 }, { x: cx, y: cy + 3 },
    { x: cx - 5, y: cy - 5 }, { x: cx + 5, y: cy + 5 },
  ].filter((s) => s.x >= 1 && s.y >= 1 && s.x <= width - 2 && s.y <= height - 2);
  return { width, height, tiles, spawns: [{ x: 1, y: 1 }, { x: width - 2, y: height - 2 }], stars };
}

// ===== src/engine/maps.js =====
// 预置地图库：10 张手工设计图，全部 17x17。
// 只写上半（y0..y8 共 9 行，含中线），下半由 180° 旋转自动补全（A↔B、a↔b 互换），
// 天然保证点对称——双方地形公平。图例同 mapFromAscii：
// '#'=墙 'D'=土堆 'g'=草丛 '*'=星星 'A'/'B'=出生点 '.'=空地


const MIRROR = { A: 'B', B: 'A', a: 'b', b: 'a' };

function symRows(top) {
  const width = top[0].length;
  for (const r of top) {
    if (r.length !== width) throw new Error(`预置地图行宽不一致（应 ${width}）：${r}`);
  }
  const rows = top.slice();
  for (let i = top.length - 2; i >= 0; i--) {
    rows.push([...top[i]].reverse().map((c) => MIRROR[c] || c).join(''));
  }
  return rows;
}

// ===== src/engine/engine.js =====
// AgenTank 核心：tick 制确定性模拟。
// 每 tick 结算顺序（测试锁死）：
//   1 计时器递减 → 2 星星重生 → 3 推进已有子弹 → 4 超载自动补射 → 5 视野更新
//   → 6 双方基于同一快照 decide → 7 按 0、1 顺序裁决动作 → 8 持续效果（炸弹引信/中毒）
// 击杀即胜；到达 maxTicks 比吃星数；再平则平局；同拍双亡 = 平局。



// ===== RULES 常量表（全部数值集中于此） =====
const RULES = {
  maxTicks: 900,
  hp: 100,
  damage: 20,          // 子弹伤害
  bulletSpeed: 2,      // 子弹飞行速度（格/tick）
  fireRange: 7,        // bot 交火参考距离（子弹实际飞行不受此限制）
  fireCd: 5,           // 开火冷却
  bombFuse: 10,        // 炸弹引信（放置后多少 tick 爆炸）
  bombRange: 2,        // 十字冲击波半径
  bombDamage: 45,      // 炸弹伤害（含自伤）
  bombCd: 30,          // 炸弹冷却
  moundHp: 2,          // 土堆被子弹摧毁所需命中数（炸弹一击摧毁）
  starRespawn: 15,     // 星星被吃后重生间隔
  maxFieldStars: 1,    // 场上同时最多星星数
  skills: {
    shield:   { cd: 60 },                    // 挡下一次子弹/炸弹伤害，消耗即失效
    freeze:   { cd: 90, dur: 8 },            // 冻结：完全不能动/转/开火
    stun:     { cd: 80, dur: 6 },            // 眩晕：移动/转向方向被种子 RNG 随机反转
    overload: { cd: 70 },                    // 下一次开火 2 连发（间隔 1 tick 同向补射）
    cloak:    { cd: 90, dur: 25 },           // 隐身
    poison:   { cd: 80, dur: 10, dmg: 2 },   // 中毒：每 tick -2 HP
    teleport: { cd: 100 },                   // 传送：非法落点重定向到最近合法格
    boost:    { cd: 90, dur: 10 },           // 疾驰：移动动作每拍走 2 格
  },
};
const SKILLS = Object.keys(RULES.skills);

const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

function manhattan(a, b) {
  return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
}

// 目标相对坦克的主轴四向（|dx|>=|dy| 取水平，平手时水平优先，保证确定性）
function cardinalTo(T, tx, ty) {
  const dx = tx - T.x;
  const dy = ty - T.y;
  if (dx === 0 && dy === 0) return null;
  if (Math.abs(dx) >= Math.abs(dy)) return [dx > 0 ? 1 : -1, 0];
  return [0, dy > 0 ? 1 : -1];
}

// 视野规则：敌方隐身技能生效 ⇒ 不可见；敌方在草丛且曼哈顿距离>1 ⇒ 不可见；其余可见。
function visibleTo(state, viewer) {
  const T = state.tanks[viewer];
  const E = state.tanks[1 - viewer];
  if (E.cloak > 0) return false;
  if (tileAt(state.map, E.x, E.y) === TILE.GRASS && manhattan(T, E) > 1) return false;
  return true;
}

// BFS 单步寻路：从目标反向做距离场，取严格更近的相邻格；敌方所在格视为不可穿越。
function nextStep(state, T, E, tx, ty) {
  const m = state.map;
  if (T.x === tx && T.y === ty) return null;
  if (!isWalkable(m, tx, ty)) return null;
  const W = m.width;
  const H = m.height;
  const dist = new Int32Array(W * H).fill(-1);
  const q = [ty * W + tx];
  dist[q[0]] = 0;
  for (let qi = 0; qi < q.length; qi++) {
    const c = q[qi];
    const cx = c % W;
    const cy = (c - cx) / W;
    const d = dist[c];
    for (const [dx, dy] of DIRS) {
      const nx = cx + dx;
      const ny = cy + dy;
      if (!isWalkable(m, nx, ny)) continue;
      if (nx === E.x && ny === E.y) continue;
      const nc = ny * W + nx;
      if (dist[nc] !== -1) continue;
      dist[nc] = d + 1;
      q.push(nc);
    }
  }
  const cur = dist[T.y * W + T.x];
  if (cur === -1) return null;
  let best = null;
  let bd = cur;
  for (const [dx, dy] of DIRS) {
    const nx = T.x + dx;
    const ny = T.y + dy;
    if (!isWalkable(m, nx, ny)) continue;
    if (nx === E.x && ny === E.y) continue;
    const d = dist[ny * W + nx];
    if (d !== -1 && d < bd) { bd = d; best = { x: nx, y: ny }; }
  }
  return best;
}

function nearestOf(T, cells) {
  let best = null;
  let bd = Infinity;
  for (const c of cells) {
    const d = Math.abs(T.x - c.x) + Math.abs(T.y - c.y);
    if (d < bd) { bd = d; best = c; }
  }
  return best ? { x: best.x, y: best.y } : null;
}

function bulletsOf(state, i) {
  return state.bullets.filter((b) => b.owner === i);
}

function makeApi(state, i) {
  const R = state.R;
  const T = state.tanks[i];
  const E = state.tanks[1 - i];
  const visible = visibleTo(state, i);
  const inFlight = () => bulletsOf(state, i).length > 0 || !!T.pendingShot;
  return {
    // 状态查询
    me: () => ({
      x: T.x, y: T.y, hp: T.hp, stars: T.stars,
      skill: T.skill,
      cloaked: T.cloak > 0,
      stunned: T.stun > 0,
      frozen: T.freeze > 0,
      poisoned: T.poison > 0,
      boosted: T.boost > 0,
      shielded: T.shield > 0,
      bulletInFlight: inFlight(),
      facing: { dx: T.facing[0], dy: T.facing[1] },
    }),
    enemy: () => ({ x: T.lastSeen.x, y: T.lastSeen.y, visible }),
    enemyVisible: () => visible,
    canFire: () => T.cd.fire <= 0 && !inFlight(),
    // ready()：无参 = 所装备技能；'bomb' = 炸弹；'fire' = 开火；技能名需与装备一致
    ready: (name) => {
      if (name == null || name === T.skill) return T.cd.skill <= 0;
      if (name === 'bomb') return T.cd.bomb <= 0;
      if (name === 'fire') return T.cd.fire <= 0;
      return false;
    },
    skill: () => T.skill,
    tick: () => state.t,
    rules: () => JSON.parse(JSON.stringify(R)),
    mapSize: () => ({ width: state.map.width, height: state.map.height }),
    inGrass: () => tileAt(state.map, T.x, T.y) === TILE.GRASS,
    walkable: (p) => !!p && isWalkable(state.map, p.x | 0, p.y | 0),
    distTo: (p) => (p ? Math.abs(T.x - p.x) + Math.abs(T.y - p.y) : Infinity),
    rand: () => T.rng(),
    // 子弹查询：自己的子弹始终可查；敌方子弹仅当处于我方炮口 90° 视锥内可见
    myBullet: () => {
      const b = bulletsOf(state, i)[0];
      return b ? { x: b.x, y: b.y, dx: b.dx, dy: b.dy } : null;
    },
    enemyBullet: () => {
      for (const b of state.bullets) {
        if (b.owner === i) continue;
        const rx = b.x - T.x;
        const ry = b.y - T.y;
        const along = rx * T.facing[0] + ry * T.facing[1];
        const perp = Math.abs(rx * T.facing[1] - ry * T.facing[0]);
        if (along > 0 && along >= perp) return { x: b.x, y: b.y, dx: b.dx, dy: b.dy };
      }
      return null;
    },
    // 炸弹查询：场上所有炸弹对双方可见（含草丛中的）
    bombs: () => state.bombs.map((b) => ({
      x: b.x, y: b.y,
      fuse: Math.max(0, b.placedAt + R.bombFuse - state.t),
      mine: b.owner === i,
    })),
    // 寻路目标查询
    nearestStar: () => nearestOf(T, state.stars),
    nearestGrass: () => {
      const cells = [];
      for (let y = 1; y < state.map.height - 1; y++) {
        for (let x = 1; x < state.map.width - 1; x++) {
          if (state.map.tiles[y][x] === TILE.GRASS) cells.push({ x, y });
        }
      }
      return nearestOf(T, cells);
    },
    safestCorner: () => {
      const m = state.map;
      const corners = [
        { x: 1, y: 1 }, { x: m.width - 2, y: 1 },
        { x: 1, y: m.height - 2 }, { x: m.width - 2, y: m.height - 2 },
      ].filter((c) => isWalkable(m, c.x, c.y) && !(c.x === E.x && c.y === E.y));
      let best = null;
      let bd = -1;
      for (const c of corners) {
        const d = Math.abs(c.x - T.lastSeen.x) + Math.abs(c.y - T.lastSeen.y);
        if (d > bd) { bd = d; best = c; }
      }
      return best ? { x: best.x, y: best.y } : null;
    },
    // 动作构造（返回值交回引擎裁决合法性）
    fireAt: (p) => (p ? { type: 'fire', x: p.x | 0, y: p.y | 0 } : null),
    moveTo: (p) => (p ? { type: 'move', x: p.x | 0, y: p.y | 0 } : null),
    patrol: () => ({ type: 'patrol' }),
    useSkill: (p) => (p && typeof p.x === 'number' ? { type: 'skill', x: p.x | 0, y: p.y | 0 } : { type: 'skill' }),
    throwBomb: () => ({ type: 'bomb' }),
    // 旧入口：映射到所装备技能，未装备 = 非法动作 no-op
    teleport: (p) => (p ? { type: 'teleport', x: p.x | 0, y: p.y | 0 } : null),
    cloak: () => ({ type: 'cloak' }),
    stun: () => ({ type: 'stun' }),
  };
}

function pickupStar(state, i, ev) {
  const T = state.tanks[i];
  const idx = state.stars.findIndex((s) => s.x === T.x && s.y === T.y);
  if (idx === -1) return;
  const s = state.stars.splice(idx, 1)[0];
  T.stars += 1;
  ev({ t: state.t, type: 'star', who: i, x: s.x, y: s.y, total: T.stars });
  if (state.stars.length === 0) state.starRespawnAt = state.t + state.R.starRespawn;
}

function maybeGoal(state, i, tx, ty, ev) {
  const T = state.tanks[i];
  const k = tx + ',' + ty;
  if (T.goalKey === k) return;
  T.goalKey = k;
  let tag = 'pos';
  if (state.stars.some((s) => s.x === tx && s.y === ty)) tag = 'star';
  else if (T.lastSeen.x === tx && T.lastSeen.y === ty) tag = 'enemy';
  ev({ t: state.t, type: 'goal', who: i, x: tx, y: ty, tag });
}

// 眩晕：移动/转向方向有 50% 概率被反转（走受害者自己的种子 RNG）
function maybeInvertDir(T, dir) {
  if (T.stun > 0 && T.rng() < 0.5) return [-dir[0], -dir[1]];
  return dir;
}

// 出膛：生成飞行子弹实体 + fire 事件；开火打破隐身并暴露位置
function spawnBullet(state, i, dx, dy, ev) {
  const T = state.tanks[i];
  const E = state.tanks[1 - i];
  if (T.cloak > 0) T.cloak = 0;
  state.bullets.push({ owner: i, x: T.x, y: T.y, dx, dy });
  ev({ t: state.t, type: 'fire', who: i, x: T.x, y: T.y, dx, dy });
  E.lastSeen = { x: T.x, y: T.y };
}

// 子弹伤害入口（护盾优先消耗）
function damageByBullet(state, owner, K, ev) {
  const R = state.R;
  if (K.shield > 0) {
    K.shield = 0;
    ev({ t: state.t, type: 'shield_block', who: K.i, source: 'bullet' });
    return;
  }
  K.hp -= R.damage;
  ev({ t: state.t, type: 'hit', who: owner, target: K.i, dmg: R.damage, hp: K.hp, x: K.x, y: K.y });
}

// 子弹进入某格的结算；返回 true 表示子弹终结
function resolveBulletCell(state, b, ev) {
  const t = state.t;
  const m = state.map;
  if (!inBounds(m, b.x, b.y)) {
    ev({ t, type: 'bullet_end', who: b.owner, x: b.x, y: b.y, reason: 'out' });
    return true;
  }
  const tile = tileAt(m, b.x, b.y);
  if (tile === TILE.WALL) {
    ev({ t, type: 'bullet_end', who: b.owner, x: b.x, y: b.y, reason: 'wall' });
    return true;
  }
  if (tile === TILE.DIRT) {
    const key = b.x + ',' + b.y;
    const hp = (state.moundHp.get(key) ?? state.R.moundHp) - 1;
    ev({ t, type: 'mound_hit', x: b.x, y: b.y, hp: Math.max(0, hp) });
    if (hp <= 0) {
      state.moundHp.delete(key);
      m.tiles[b.y][b.x] = TILE.EMPTY;
      ev({ t, type: 'mound_destroyed', x: b.x, y: b.y });
    } else {
      state.moundHp.set(key, hp);
    }
    ev({ t, type: 'bullet_end', who: b.owner, x: b.x, y: b.y, reason: 'mound' });
    return true;
  }
  // 子弹不伤及发射者本人（穿过自身）：避免“超载补射 + 同向前进”走进自己弹道的退化自伤
  const K = state.tanks.find((T) => T.i !== b.owner && T.hp > 0 && T.x === b.x && T.y === b.y);
  if (K) {
    damageByBullet(state, b.owner, K, ev);
    ev({ t, type: 'bullet_end', who: b.owner, x: b.x, y: b.y, reason: 'hit' });
    return true;
  }
  return false;
}

// 每 tick 推进所有在飞子弹（先于双方动作）
function advanceBullets(state, ev) {
  const R = state.R;
  const remaining = [];
  for (const b of state.bullets) {
    let ended = false;
    for (let s = 0; s < R.bulletSpeed && !ended; s++) {
      b.x += b.dx;
      b.y += b.dy;
      ended = resolveBulletCell(state, b, ev);
    }
    if (!ended) remaining.push(b);
  }
  state.bullets = remaining;
}

// 十字冲击波：墙截断传播；土堆被一击摧毁且截断其后传播
function explodeBomb(state, bomb, ev) {
  const R = state.R;
  const m = state.map;
  const t = state.t;
  const cells = [{ x: bomb.x, y: bomb.y }];
  for (const [dx, dy] of DIRS) {
    for (let r = 1; r <= R.bombRange; r++) {
      const x = bomb.x + dx * r;
      const y = bomb.y + dy * r;
      if (!inBounds(m, x, y)) break;
      const tile = tileAt(m, x, y);
      if (tile === TILE.WALL) break;
      cells.push({ x, y });
      if (tile === TILE.DIRT) {
        state.moundHp.delete(x + ',' + y);
        m.tiles[y][x] = TILE.EMPTY;
        ev({ t, type: 'mound_destroyed', x, y });
        break;
      }
    }
  }
  const hits = [];
  for (const K of state.tanks) {
    if (K.hp <= 0) continue;
    if (!cells.some((c) => c.x === K.x && c.y === K.y)) continue;
    if (K.shield > 0) {
      K.shield = 0;
      ev({ t, type: 'shield_block', who: K.i, source: 'bomb' });
      continue;
    }
    K.hp -= R.bombDamage;
    hits.push({ who: K.i, dmg: R.bombDamage });
  }
  ev({ t, type: 'bomb_explode', who: bomb.owner, x: bomb.x, y: bomb.y, cells, hits });
}

// 传送落点合法性：非墙/土堆/星星格/敌人所在格；非法则重定向到（曼哈顿）最近合法格，确定性扫描
function teleportDest(state, i, tx, ty) {
  const m = state.map;
  tx = Math.max(0, Math.min(m.width - 1, tx));
  ty = Math.max(0, Math.min(m.height - 1, ty));
  const E = state.tanks[1 - i];
  const legal = (x, y) => inBounds(m, x, y)
    && tileAt(m, x, y) !== TILE.WALL && tileAt(m, x, y) !== TILE.DIRT
    && !state.stars.some((s) => s.x === x && s.y === y)
    && !(E.x === x && E.y === y);
  if (legal(tx, ty)) return { x: tx, y: ty };
  const maxD = m.width + m.height;
  for (let d = 1; d <= maxD; d++) {
    for (let dy = -d; dy <= d; dy++) {
      const rem = d - Math.abs(dy);
      for (const dx of rem === 0 ? [0] : [-rem, rem]) {
        const x = tx + dx;
        const y = ty + dy;
        if (legal(x, y)) return { x, y };
      }
    }
  }
  return null;
}

// 统一技能施放（useSkill 与旧入口都汇到这里）
function castSkill(state, i, arg, ev) {
  const R = state.R;
  const T = state.tanks[i];
  const E = state.tanks[1 - i];
  const t = state.t;
  const name = T.skill;
  const S = R.skills[name];
  if (T.cd.skill > 0) return;
  switch (name) {
    case 'shield': {
      if (T.shield > 0) return;
      T.cd.skill = S.cd;
      T.shield = 1;
      ev({ t, type: 'skill', who: i, name });
      break;
    }
    case 'freeze': {
      if (!visibleTo(state, i)) return;
      T.cd.skill = S.cd;
      E.freeze = S.dur;
      ev({ t, type: 'skill', who: i, name });
      ev({ t, type: 'freeze_hit', who: i, target: 1 - i, duration: S.dur });
      break;
    }
    case 'stun': {
      if (!visibleTo(state, i)) return;
      T.cd.skill = S.cd;
      E.stun = S.dur;
      ev({ t, type: 'skill', who: i, name });
      ev({ t, type: 'stun_hit', who: i, target: 1 - i, duration: S.dur });
      break;
    }
    case 'overload': {
      if (T.overloadArmed) return;
      T.cd.skill = S.cd;
      T.overloadArmed = true;
      ev({ t, type: 'skill', who: i, name });
      break;
    }
    case 'cloak': {
      T.cd.skill = S.cd;
      T.cloak = S.dur;
      ev({ t, type: 'skill', who: i, name, duration: S.dur });
      break;
    }
    case 'poison': {
      if (!visibleTo(state, i)) return;
      T.cd.skill = S.cd;
      E.poison = S.dur;
      ev({ t, type: 'skill', who: i, name });
      ev({ t, type: 'poison_hit', who: i, target: 1 - i, duration: S.dur });
      break;
    }
    case 'teleport': {
      if (!arg) return;
      const dest = teleportDest(state, i, arg.x | 0, arg.y | 0);
      if (!dest) return;
      T.cd.skill = S.cd;
      T.x = dest.x;
      T.y = dest.y; // 炮口朝向不变
      ev({ t, type: 'skill', who: i, name, x: dest.x, y: dest.y });
      ev({ t, type: 'teleport_reveal', who: i, x: dest.x, y: dest.y });
      E.lastSeen = { x: dest.x, y: dest.y };
      break;
    }
    case 'boost': {
      T.cd.skill = S.cd;
      T.boost = S.dur;
      ev({ t, type: 'skill', who: i, name, duration: S.dur });
      break;
    }
    default:
      break;
  }
}

// 单步移动（含眩晕反转与吃星）；返回是否真的移动了
function moveStep(state, i, tx, ty, ev) {
  const T = state.tanks[i];
  const E = state.tanks[1 - i];
  const step = nextStep(state, T, E, tx, ty);
  if (!step) return false;
  const dir = maybeInvertDir(T, [step.x - T.x, step.y - T.y]);
  T.facing = dir;
  const nx = T.x + dir[0];
  const ny = T.y + dir[1];
  if (!isWalkable(state.map, nx, ny) || (nx === E.x && ny === E.y)) return false; // 反转后撞墙/撞敌：只转向不动
  T.x = nx;
  T.y = ny;
  ev({ t: state.t, type: 'move', who: i, x: T.x, y: T.y });
  pickupStar(state, i, ev);
  return true;
}

function applyAction(state, i, a, ev) {
  const R = state.R;
  const T = state.tanks[i];
  const E = state.tanks[1 - i];
  const t = state.t;
  if (T.hp <= 0) return;
  if (T.freeze > 0) return; // 冻结中：动作作废（眩晕仍可行动，只是方向被随机反转）
  if (!a || typeof a !== 'object' || typeof a.type !== 'string') return; // 空/非法动作 = 待机
  switch (a.type) {
    case 'move': {
      const tx = a.x | 0;
      const ty = a.y | 0;
      maybeGoal(state, i, tx, ty, ev);
      const steps = T.boost > 0 ? 2 : 1; // 疾驰：每拍 2 格
      for (let s = 0; s < steps; s++) {
        if (!moveStep(state, i, tx, ty, ev)) break;
      }
      break;
    }
    case 'patrol': {
      const steps = T.boost > 0 ? 2 : 1;
      for (let s = 0; s < steps; s++) {
        const opts = [];
        for (const [dx, dy] of DIRS) {
          const nx = T.x + dx;
          const ny = T.y + dy;
          if (!isWalkable(state.map, nx, ny)) continue;
          if (nx === E.x && ny === E.y) continue;
          opts.push({ x: nx, y: ny });
        }
        if (!opts.length) break;
        const p = opts[randInt(T.rng, opts.length)];
        const dir = maybeInvertDir(T, [p.x - T.x, p.y - T.y]);
        T.facing = dir;
        const nx = T.x + dir[0];
        const ny = T.y + dir[1];
        if (!isWalkable(state.map, nx, ny) || (nx === E.x && ny === E.y)) break;
        T.x = nx;
        T.y = ny;
        ev({ t, type: 'move', who: i, x: T.x, y: T.y });
        pickupStar(state, i, ev);
      }
      break;
    }
    case 'fire': {
      if (T.cd.fire > 0) break;
      if (bulletsOf(state, i).length > 0 || T.pendingShot) break; // 单发在飞：再 fire = 非法动作 no-op
      const dir = cardinalTo(T, a.x | 0, a.y | 0);
      if (!dir) break; // 朝自己开火视为非法
      // 炮口硬规则：只能沿水平/垂直方向开炮；炮口未对准时本拍先转向，下一拍才能射击
      if (T.facing[0] !== dir[0] || T.facing[1] !== dir[1]) {
        const d2 = maybeInvertDir(T, dir);
        T.facing = d2;
        ev({ t, type: 'turn', who: i, dx: d2[0], dy: d2[1] });
        break;
      }
      T.cd.fire = R.fireCd;
      spawnBullet(state, i, dir[0], dir[1], ev);
      if (T.overloadArmed) { // 超载：登记 1 拍后的同向自动补射
        T.overloadArmed = false;
        T.pendingShot = { dx: dir[0], dy: dir[1], delay: 1 };
      }
      break;
    }
    case 'bomb': {
      if (T.cd.bomb > 0) break;
      if (state.bombs.some((b) => b.owner === i)) break; // 同时最多 1 枚自己的炸弹
      T.cd.bomb = R.bombCd;
      state.bombs.push({ owner: i, x: T.x, y: T.y, placedAt: t });
      ev({ t, type: 'bomb_place', who: i, x: T.x, y: T.y });
      break;
    }
    case 'skill':
      castSkill(state, i, typeof a.x === 'number' ? { x: a.x, y: a.y } : null, ev);
      break;
    // 旧入口映射：仅当装备对应技能时生效，否则 no-op
    case 'teleport':
      if (T.skill === 'teleport') castSkill(state, i, { x: a.x | 0, y: a.y | 0 }, ev);
      break;
    case 'cloak':
      if (T.skill === 'cloak') castSkill(state, i, null, ev);
      break;
    case 'stun':
      if (T.skill === 'stun') castSkill(state, i, null, ev);
      break;
    default:
      break;
  }
}

function randomFreeCell(state) {
  const m = state.map;
  for (let tries = 0; tries < 50; tries++) {
    const x = 1 + randInt(state.rng, m.width - 2);
    const y = 1 + randInt(state.rng, m.height - 2);
    if (!isWalkable(m, x, y)) continue;
    if (state.tanks.some((T) => T.x === x && T.y === y)) continue;
    if (state.stars.some((s) => s.x === x && s.y === y)) continue;
    return { x, y };
  }
  return null;
}

// 阵亡判定：单亡 = 对方胜；同拍双亡 = 平局
function checkDeath(state, ev) {
  for (const T of state.tanks) {
    if (T.hp <= 0 && !T.deadAnnounced) {
      T.deadAnnounced = true;
      ev({ t: state.t, type: 'death', who: T.i });
    }
  }
  const alive = state.tanks.filter((T) => T.hp > 0);
  if (alive.length === 2) return null;
  if (alive.length === 1) return { winner: alive[0].i, reason: 'kill' };
  return { winner: null, reason: 'draw' };
}

function runMatch(opts = {}) {
  const { seed = 1, botA, botB, map = null } = opts;
  const R = {
    ...RULES,
    ...(opts.rules || {}),
    skills: { ...RULES.skills, ...((opts.rules || {}).skills || {}) },
  };
  if (opts.maxTicks != null) R.maxTicks = opts.maxTicks;
  // 技能 8 选 1：显式参数 > bot 自带偏好（bot.skill）> 默认 A=teleport、B=cloak
  const skillA = opts.skillA ?? botA?.skill ?? 'teleport';
  const skillB = opts.skillB ?? botB?.skill ?? 'cloak';
  for (const s of [skillA, skillB]) {
    if (!R.skills[s]) throw new Error(`未知技能: ${s}（可选：${SKILLS.join('/')}）`);
  }
  const rng = mulberry32(seed >>> 0);
  const m = map ? cloneMap(map) : generateMap(rng);
  const state = {
    R,
    rng,
    map: m,
    t: 0,
    stars: m.stars.slice(0, R.maxFieldStars).map((s) => ({ x: s.x, y: s.y })), // 单星：初始截断
    starRespawnAt: null,
    bullets: [],
    bombs: [],
    moundHp: new Map(),
    events: [],
    bots: [botA, botB],
    tanks: m.spawns.map((s, i) => ({
      i,
      x: s.x,
      y: s.y,
      hp: R.hp,
      stars: 0,
      skill: i === 0 ? skillA : skillB,
      facing: i === 0 ? [1, 0] : [-1, 0], // 炮口四向朝向：P1 朝右、P2 朝左
      cd: { fire: 0, skill: 0, bomb: 0 },
      cloak: 0,
      freeze: 0,
      stun: 0,
      poison: 0,
      boost: 0,
      shield: 0,
      overloadArmed: false,
      pendingShot: null,
      deadAnnounced: false,
      lastSeen: { x: m.spawns[1 - i].x, y: m.spawns[1 - i].y },
      goalKey: null,
      rng: mulberry32((seed + 0x9e3779b9 * (i + 1)) >>> 0),
    })),
  };
  const ev = (e) => state.events.push(e);
  ev({ t: 0, type: 'start', seed, width: m.width, height: m.height, skills: [skillA, skillB] });

  let ended = null;
  for (let t = 0; t < R.maxTicks && !ended; t++) {
    state.t = t;
    // 1. 计时器
    for (const T of state.tanks) {
      for (const k of Object.keys(T.cd)) if (T.cd[k] > 0) T.cd[k]--;
      if (T.cloak > 0) T.cloak--;
      if (T.freeze > 0) T.freeze--;
      if (T.stun > 0) T.stun--;
      if (T.boost > 0) T.boost--;
    }
    // 2. 星星重生（单星：被吃后 starRespawn tick 在种子 RNG 合法格重生）
    if (state.starRespawnAt != null && t >= state.starRespawnAt) {
      if (state.stars.length < R.maxFieldStars) {
        const p = randomFreeCell(state);
        if (p) { state.stars.push(p); ev({ t, type: 'star_spawn', x: p.x, y: p.y }); }
      }
      state.starRespawnAt = null;
    }
    // 3. 推进已有子弹（先于双方动作）
    advanceBullets(state, ev);
    ended = checkDeath(state, ev);
    if (ended) break;
    // 4. 超载自动补射（不占本人手动动作）
    for (const T of state.tanks) {
      if (T.hp <= 0 || !T.pendingShot) continue;
      T.pendingShot.delay--;
      if (T.pendingShot.delay <= 0) {
        const { dx, dy } = T.pendingShot;
        T.pendingShot = null;
        spawnBullet(state, T.i, dx, dy, ev);
      }
    }
    // 5. 视野与最后目击位置
    for (const i of [0, 1]) {
      if (visibleTo(state, i)) {
        const E = state.tanks[1 - i];
        state.tanks[i].lastSeen = { x: E.x, y: E.y };
      }
    }
    // 6. 双方基于同一快照决策（决策阶段不改状态）
    const actions = [0, 1].map((i) => {
      try {
        return state.bots[i](makeApi(state, i));
      } catch {
        return null; // 策略脚本抛错 = 本拍待机
      }
    });
    // 7. 按固定顺序裁决
    for (const i of [0, 1]) {
      if (ended) break;
      applyAction(state, i, actions[i], ev);
      ended = checkDeath(state, ev);
    }
    if (ended) break;
    // 8. 持续效果：炸弹引信 → 爆炸；中毒掉血
    const keep = [];
    for (const b of state.bombs) {
      if (t - b.placedAt >= R.bombFuse) explodeBomb(state, b, ev);
      else keep.push(b);
    }
    state.bombs = keep;
    for (const T of state.tanks) {
      if (T.hp <= 0 || T.poison <= 0) continue;
      T.poison--;
      T.hp -= R.skills.poison.dmg;
      ev({ t, type: 'poison_tick', target: T.i, dmg: R.skills.poison.dmg, hp: T.hp });
    }
    ended = checkDeath(state, ev);
  }

  const [a, b] = state.tanks;
  if (!ended) {
    ended = a.stars === b.stars
      ? { winner: null, reason: 'draw' }
      : { winner: a.stars > b.stars ? 0 : 1, reason: 'stars' };
  }
  ev({
    t: state.t,
    type: 'end',
    winner: ended.winner,
    reason: ended.reason,
    stars: [a.stars, b.stars],
    hp: [a.hp, b.hp],
  });
  return {
    events: state.events,
    winner: ended.winner,
    reason: ended.reason,
    stars: [a.stars, b.stars],
    skills: [skillA, skillB],
    ticks: state.t + 1,
    seed,
  };
}

// ===== src/engine/report.js =====
// 战报文本渲染：把结构化事件数组渲染成可读文字行（供前端回放/展示）。

const SKILL_NAMES = {
  shield: '护盾', freeze: '冰冻', stun: '眩晕', overload: '超载',
  cloak: '隐身', poison: '剧毒', teleport: '传送', boost: '疾驰',
};

function renderText(result, names = ['甲', '乙']) {
  const nm = (i) => names[i] ?? `P${i}`;
  const lines = [];
  for (const e of result.events) {
    const t = `t=${String(e.t).padStart(3, '0')}`;
    switch (e.type) {
      case 'start': {
        const sk = e.skills ? ` 技能 ${nm(0)}=${SKILL_NAMES[e.skills[0]] ?? e.skills[0]} ${nm(1)}=${SKILL_NAMES[e.skills[1]] ?? e.skills[1]}` : '';
        lines.push(`${t} 对战开始 seed=${e.seed} 地图${e.width}x${e.height}${sk}`);
        break;
      }
      case 'goal':
        if (e.tag === 'star') lines.push(`${t} ${nm(e.who)} 直奔星星`);
        else if (e.tag === 'enemy') lines.push(`${t} ${nm(e.who)} 扑向敌人`);
        else lines.push(`${t} ${nm(e.who)} 移动到(${e.x},${e.y})`);
        break;
      case 'turn': {
        const arrow = { '1,0': '→', '-1,0': '←', '0,1': '↓', '0,-1': '↑' }[e.dx + ',' + e.dy] ?? '';
        lines.push(`${t} ${nm(e.who)} 转炮口${arrow}`);
        break;
      }
      case 'fire':
        lines.push(`${t} ${nm(e.who)} 开火`);
        break;
      case 'hit':
        lines.push(`${t} ${nm(e.who)} 命中 ${nm(e.target)}（-${e.dmg}，剩${e.hp}）`);
        break;
      case 'bullet_end':
        if (e.reason === 'wall') lines.push(`${t} ${nm(e.who)} 的子弹被墙挡下`);
        else if (e.reason === 'mound') lines.push(`${t} ${nm(e.who)} 的子弹打在土堆上`);
        else if (e.reason === 'out') lines.push(`${t} ${nm(e.who)} 的子弹飞出场外`);
        break;
      case 'mound_hit':
        if (e.hp > 0) lines.push(`${t} (${e.x},${e.y}) 的土堆被打出裂缝`);
        break;
      case 'mound_destroyed':
        lines.push(`${t} (${e.x},${e.y}) 的土堆被摧毁`);
        break;
      case 'bomb_place':
        lines.push(`${t} ${nm(e.who)} 在(${e.x},${e.y})放下炸弹`);
        break;
      case 'bomb_explode': {
        const dmg = e.hits.map((h) => `${nm(h.who)}-${h.dmg}`).join(' ');
        lines.push(`${t} 炸弹在(${e.x},${e.y})爆炸${dmg ? `，${dmg}` : '，无人受伤'}`);
        break;
      }
      case 'shield_block':
        lines.push(`${t} ${nm(e.who)} 的护盾挡下了${e.source === 'bomb' ? '炸弹' : '子弹'}`);
        break;
      case 'star':
        lines.push(`${t} ${nm(e.who)} 吃星（${e.total}）`);
        break;
      case 'star_spawn':
        lines.push(`${t} 新星星出现在(${e.x},${e.y})`);
        break;
      case 'skill': {
        const n = SKILL_NAMES[e.name] ?? e.name;
        if (e.name === 'teleport') lines.push(`${t} ${nm(e.who)} 传送到(${e.x},${e.y})`);
        else if (e.name === 'overload') lines.push(`${t} ${nm(e.who)} 超载压弹，下次开火 2 连发`);
        else lines.push(`${t} ${nm(e.who)} 施放${n}`);
        break;
      }
      case 'freeze_hit':
        lines.push(`${t} ${nm(e.target)} 被冰冻${e.duration}拍，动弹不得`);
        break;
      case 'stun_hit':
        lines.push(`${t} ${nm(e.target)} 被眩晕${e.duration}拍，操作错乱`);
        break;
      case 'poison_hit':
        lines.push(`${t} ${nm(e.target)} 中毒，${e.duration}拍内持续掉血`);
        break;
      case 'teleport_reveal':
        lines.push(`${t} ${nm(e.who)} 现身于(${e.x},${e.y})`);
        break;
      case 'death':
        lines.push(`${t} ${nm(e.who)} 被击毁`);
        break;
      case 'end':
        lines.push(
          e.winner == null
            ? `${t} 平局（星${e.stars[0]}:${e.stars[1]}）`
            : `${t} ${nm(e.winner)} 获胜（${e.reason === 'kill' ? '击杀' : '星数'}，星${e.stars[0]}:${e.stars[1]}）`,
        );
        break;
      default:
        break; // poison_tick 等逐拍事件不入文字战报，避免刷屏
    }
  }
  return lines;
}

// ===== bots/util.js =====
// bot 公共小工具：炸弹威胁应对。
// 判定自己是否站在任一炸弹（含自己放的）的十字爆区内且引信将尽；是则走向最近的爆区外落点。
function bombEvade(api) {
  const me = api.me();
  const bombs = api.bombs();
  if (!bombs.length) return null;
  const danger = (x, y) => bombs.some((b) =>
    b.fuse <= 6 && ((b.x === x && Math.abs(b.y - y) <= 2) || (b.y === y && Math.abs(b.x - x) <= 2)));
  if (!danger(me.x, me.y)) return null;
  for (let d = 1; d <= 3; d++) {
    for (let dy = -d; dy <= d; dy++) {
      const rem = d - Math.abs(dy);
      for (const dx of rem === 0 ? [0] : [-rem, rem]) {
        const p = { x: me.x + dx, y: me.y + dy };
        if (api.walkable(p) && !danger(p.x, p.y)) return api.moveTo(p);
      }
    }
  }
  return null;
}

// ===== bots/camper.js =====
// 蹲草流（技能：冰冻）：看得见敌人就先冰冻再交火；看不见就找草丛蹲着装死；躲炸弹。


function camper(api) {
  const evade = bombEvade(api);
  if (evade) return evade;
  const foe = api.enemy();
  const me = api.me();
  const R = api.rules();
  const d = api.distTo(foe);
  if (api.enemyVisible()) {
    if (api.ready() && d <= R.fireRange) return api.useSkill(); // 冰冻定身
    if (api.canFire() && d <= R.fireRange && (foe.x === me.x || foe.y === me.y)) return api.fireAt(foe);
    if (d > R.fireRange) return api.moveTo(foe); // 追到射程内
    if (api.canFire()) return api.fireAt(foe); // 未对齐：先借 fireAt 转向压制
    return null; // 装填/在飞：原地不动
  }
  if (!api.inGrass()) {
    const g = api.nearestGrass();
    if (g) return api.moveTo(g);
    const s = api.nearestStar();
    return s ? api.moveTo(s) : api.patrol();
  }
  return null; // 已在草丛：蹲住
}
camper.skill = 'freeze';

// ===== bots/starGrabber.js =====
// 抢星流（技能：疾驰）：以吃星为主，远星开疾驰冲刺，顺手开枪；躲炸弹。


function starGrabber(api) {
  const evade = bombEvade(api);
  if (evade) return evade;
  const me = api.me();
  const foe = api.enemy();
  const R = api.rules();
  if (api.enemyVisible() && api.canFire() && api.distTo(foe) <= R.fireRange
    && (foe.x === me.x || foe.y === me.y)) {
    return api.fireAt(foe);
  }
  const star = api.nearestStar();
  if (star && !me.boosted && api.ready() && api.distTo(star) >= 4) return api.useSkill(); // 疾驰抢星
  return star ? api.moveTo(star) : api.patrol();
}
starGrabber.skill = 'boost';

// ===== bots/brawler.js =====
// 贴脸流（技能：超载）：死咬最后目击位置贴上去，先超载压弹再 2 连发，贴身丢炸弹；躲炸弹。


function brawler(api) {
  const evade = bombEvade(api);
  if (evade) return evade;
  const foe = api.enemy();
  const R = api.rules();
  const d = api.distTo(foe);
  if (api.enemyVisible()) {
    if (api.ready() && api.canFire() && d <= R.fireRange) return api.useSkill(); // 超载压弹
    if (api.canFire() && d <= R.fireRange) return api.fireAt(foe);
    if (d <= 2 && api.ready('bomb')) return api.throwBomb(); // 贴身丢雷（随后 bombEvade 自动撤离）
  }
  if (d === 0) return api.patrol(); // 已到最后目击点仍没人：就地搜索
  return api.moveTo(foe);
}
brawler.skill = 'overload';

// ===== bots/stealth.js =====
// 隐身偷袭流（技能：隐身）：先开隐身摸过去，进射程立刻开火（开火破隐），残血撤向远角；躲炸弹。


function stealth(api) {
  const evade = bombEvade(api);
  if (evade) return evade;
  const me = api.me();
  const foe = api.enemy();
  const R = api.rules();
  const d = api.distTo(foe);
  if (me.hp < 30 && d <= 4) {
    const c = api.safestCorner();
    if (c) return api.moveTo(c);
  }
  if (api.enemyVisible() && api.canFire() && d <= R.fireRange) return api.fireAt(foe);
  if (!me.cloaked && api.ready() && d > 2) return api.useSkill();
  if (d === 0) return api.patrol();
  return api.moveTo(foe);
}
stealth.skill = 'cloak';

// ===== bots/baseline.js =====
// 随机乱走基线：只会随机巡逻，从不开火——用于衡量四流派 bot 的强度下限。
function baseline(api) {
  return api.patrol();
}

// ===== bots barrel shim =====
const bots = { camper, starGrabber, brawler, stealth, baseline };

// ===== web/app.js =====
// AgenTank 网页端 UI：本地跑引擎对战 + canvas 逐 tick 回放 + 实时战报 + 天梯。
// 开发版经 <script type="module"> 加载；发布版由 scripts/build-web.mjs 去 import/export 内联进单文件。



const $id = (s) => document.getElementById(s);

// ---------- 默认脚本（效果稿同款） ----------
const DEFAULT_SCRIPT = `// 你的战术：优先吃星，残血传送跑路
export default function decide(api) {
  const me = api.me();
  const star = api.nearestStar();

  // 看得见敌人就开炮
  if (api.enemyVisible() && api.canFire())
    return api.fireAt(api.enemy());

  // 残血：传送去安全角落
  if (me.hp < 30 && api.ready('teleport'))
    return api.teleport(api.safestCorner());

  // 默认：抢最近的星
  return star ? api.moveTo(star)
              : api.patrol();
}
`;

// ---------- 内置天梯阵容 ----------
const ROSTER = [
  { key: 'stealth', tank: '幽灵-7', style: '隐身偷袭', fn: bots.stealth },
  { key: 'starGrabber', tank: '采星者', style: '抢星', fn: bots.starGrabber },
  { key: 'camper', tank: '草垛王', style: '蹲草', fn: bots.camper },
  { key: 'brawler', tank: '铁头娃', style: '贴脸', fn: bots.brawler },
];

// ---------- 工具 ----------
function seedFromString(s) {
  s = String(s == null ? '' : s).trim();
  if (!s) s = '1';
  if (/^\d+$/.test(s) && s.length <= 10) return Number(s) >>> 0;
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// 默认脚本的预编译等价实现（托管环境 CSP 禁 eval 时的降级路径，语义与 DEFAULT_SCRIPT 逐行一致）
function defaultDecide(api) {
  const me = api.me();
  const star = api.nearestStar();
  if (api.enemyVisible() && api.canFire()) return api.fireAt(api.enemy());
  if (me.hp < 30 && api.ready('teleport')) return api.teleport(api.safestCorner());
  return star ? api.moveTo(star) : api.patrol();
}

// 探测宿主是否允许 eval（run.ceo artifact 的 CSP 为 script-src 'unsafe-inline'，无 'unsafe-eval'）
const EVAL_OK = (() => { try { new Function(''); return true; } catch { return false; } })();

function compileScript(src) {
  if (!EVAL_OK) {
    if (String(src).replace(/\s+/g, '') === DEFAULT_SCRIPT.replace(/\s+/g, ''))
      return defaultDecide;
    throw new Error('线上托管版受 CSP 限制（禁 eval），暂不支持编译改动后的脚本；默认脚本可直接开战。要自定义脚本，请把本页另存为 .html 在本地打开。');
  }
  const m = src.match(/export\s+default\s+function\s+([A-Za-z_$][\w$]*)/);
  const entry = m ? m[1] : 'decide';
  const code = String(src).replace(/export\s+default\s+/g, '');
  const factory = new Function(
    '"use strict";\n' + code +
    '\n;if (typeof ' + entry + ' === "function") return ' + entry + ';' +
    '\nthrow new Error("未找到入口函数 ' + entry + '(api)，请定义 function decide(api) {...}");'
  );
  const fn = factory();
  if (typeof fn !== 'function') throw new Error('脚本未提供 decide(api) 函数');
  return fn;
}

function guardWrap(fn, box) {
  return (api) => {
    try { return fn(api); } catch (e) {
      box.count++; box.last = String((e && e.message) || e);
      return null; // 报错 = 本拍待机（与引擎口径一致）
    }
  };
}

function showErr(msg) { errEl.textContent = msg; errEl.classList.add('show'); }
function hideErr() { errEl.classList.remove('show'); }

// ---------- 版本存储 ----------
let curVersion = 1;
let versionCount = 1;
function loadStore() {
  try {
    const raw = localStorage.getItem('agentank.save');
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s.code === 'string' && s.code.trim()) {
        editorEl.value = s.code;
        curVersion = s.v || 1;
        versionCount = s.n || 1;
      }
    }
  } catch { /* file:// 或隐私模式下无 localStorage：忽略 */ }
}
function saveVersion() {
  versionCount++;
  curVersion = versionCount;
  try {
    localStorage.setItem('agentank.save', JSON.stringify({ code: editorEl.value, v: curVersion, n: versionCount }));
  } catch { /* 忽略 */ }
  updateVersionUi();
  scheduleLadder();
}
function updateVersionUi() {
  saveBtn.textContent = `保存为新版本（当前 v${curVersion} · 共 ${versionCount} 版）`;
  editorTitle.textContent = `策略脚本 · 我的坦克 v${curVersion}`;
}

// ---------- 回放时间线（由事件数组重建每 tick 快照） ----------
function buildTimeline(map, result) {
  const ticks = result.ticks;
  const byTick = Array.from({ length: ticks }, () => []);
  for (const e of result.events) if (e.t >= 0 && e.t < ticks) byTick[e.t].push(e);
  const pos = map.spawns.map((s) => ({ x: s.x, y: s.y }));
  const hp = [RULES.hp, RULES.hp];
  const held = [0, 0];
  const cloakLeft = [0, 0];
  const stunLeft = [0, 0];
  const frozenLeft = [0, 0];
  const poisonLeft = [0, 0];
  const shieldOn = [false, false];
  const facing = [0, Math.PI];
  const dead = [false, false];
  // 单星规则：引擎只保留地图声明的第一颗星，渲染同口径截断
  let field = map.stars.slice(0, RULES.maxFieldStars ?? map.stars.length).map((s) => ({ x: s.x, y: s.y }));
  let bombs = [];              // 在场炸弹 [{x,y,t0}]
  let gone = new Set();        // 已摧毁土堆 "x,y"
  let cracked = new Set();     // 打裂土堆 "x,y"
  const frames = [];
  const shots = [];
  const sparks = [];
  const pending = [null, null];
  for (let t = 0; t < ticks; t++) {
    for (const i of [0, 1]) {
      if (cloakLeft[i] > 0) cloakLeft[i]--;
      if (stunLeft[i] > 0) stunLeft[i]--;
      if (frozenLeft[i] > 0) frozenLeft[i]--;
      if (poisonLeft[i] > 0) poisonLeft[i]--;
    }
    for (const e of byTick[t]) {
      switch (e.type) {
        case 'move': {
          const dx = e.x - pos[e.who].x;
          const dy = e.y - pos[e.who].y;
          if (dx || dy) facing[e.who] = Math.atan2(dy, dx);
          pos[e.who] = { x: e.x, y: e.y };
          break;
        }
        case 'star':
          field = field.filter((s) => !(s.x === e.x && s.y === e.y));
          held[e.who] = e.total;
          break;
        case 'star_spawn':
          field = field.concat([{ x: e.x, y: e.y }]);
          break;
        case 'turn':
          facing[e.who] = Math.atan2(e.dy, e.dx);
          break;
        case 'fire':
          facing[e.who] = Math.atan2(e.dy, e.dx);
          if (cloakLeft[e.who] > 0) cloakLeft[e.who] = 0; // 开火破隐
          pending[e.who] = { who: e.who, t0: t, x0: e.x, y0: e.y };
          break;
        case 'bullet_end':
          if (pending[e.who]) {
            shots.push({ ...pending[e.who], t1: t, x1: e.x, y1: e.y, hit: e.reason === 'hit' });
            pending[e.who] = null;
          }
          break;
        case 'hit':
          hp[e.target] = e.hp;
          sparks.push({ t, x: e.x, y: e.y, kind: 'hit' });
          break;
        case 'mound_hit':
          cracked = new Set(cracked).add(`${e.x},${e.y}`);
          break;
        case 'mound_destroyed':
          gone = new Set(gone).add(`${e.x},${e.y}`);
          sparks.push({ t, x: e.x, y: e.y, kind: 'hit' });
          break;
        case 'bomb_place':
          bombs = bombs.concat([{ x: e.x, y: e.y, t0: t }]);
          break;
        case 'bomb_explode':
          bombs = bombs.filter((b) => !(b.x === e.x && b.y === e.y));
          for (const c of e.cells || []) sparks.push({ t, x: c.x, y: c.y, kind: 'boom' });
          for (const h of e.hits || []) hp[h.who] = Math.max(0, hp[h.who] - h.dmg);
          break;
        case 'skill':
          if (e.name === 'teleport') {
            sparks.push({ t, x: pos[e.who].x, y: pos[e.who].y, kind: 'tp' });
            pos[e.who] = { x: e.x, y: e.y };
            sparks.push({ t, x: e.x, y: e.y, kind: 'tp' });
          } else if (e.name === 'cloak') {
            cloakLeft[e.who] = e.duration;
          } else if (e.name === 'shield') {
            shieldOn[e.who] = true;
          }
          break;
        case 'shield_block':
          shieldOn[e.who] = false;
          sparks.push({ t, x: pos[e.who].x, y: pos[e.who].y, kind: 'shield' });
          break;
        case 'freeze_hit':
          frozenLeft[e.target] = e.duration;
          break;
        case 'stun_hit':
          stunLeft[e.target] = e.duration;
          break;
        case 'poison_hit':
          poisonLeft[e.target] = e.duration;
          break;
        case 'poison_tick':
          hp[e.target] = e.hp;
          break;
        case 'death':
          dead[e.who] = true;
          break;
        default:
          break;
      }
    }
    frames.push({
      pos: pos.map((p) => ({ ...p })),
      hp: [...hp], held: [...held],
      cloak: [...cloakLeft], stun: [...stunLeft],
      frozen: [...frozenLeft], poison: [...poisonLeft], shield: [...shieldOn],
      facing: [...facing], dead: [...dead],
      field, bombs, gone, cracked, // 均为 copy-on-write 新引用，即本 tick 快照
    });
  }
  return { frames, shots, sparks };
}

// ---------- 战报时间线（中文行 + 着色） ----------
function buildLog(result, names) {
  const held = [0, 0];
  const out = [];
  const nm = (i) => `<span class="${i === 0 ? 'p1' : 'p2'}">${names[i]}</span>`;
  for (const e of result.events) {
    let html = null;
    switch (e.type) {
      case 'start':
        html = `对战开始 · 地图 ${e.width}×${e.height}`;
        if (e.skills) html += ` · 技能 ${nm(0)}=<span class="sk">${SKILL_CN[e.skills[0]] ?? e.skills[0]}</span> ${nm(1)}=<span class="sk">${SKILL_CN[e.skills[1]] ?? e.skills[1]}</span>`;
        break;
      case 'goal':
        html = e.tag === 'star' ? `${nm(e.who)} 直奔星星 (${e.x},${e.y})`
          : e.tag === 'enemy' ? `${nm(e.who)} 扑向敌人 (${e.x},${e.y})`
            : `${nm(e.who)} 移动到 (${e.x},${e.y})`;
        break;
      case 'turn': html = `${nm(e.who)} 转炮口${{ '1,0': '→', '-1,0': '←', '0,1': '↓', '0,-1': '↑' }[e.dx + ',' + e.dy] ?? ''}`; break;
      case 'fire': html = `${nm(e.who)} 开火`; break;
      case 'hit': html = `${nm(e.who)} 命中 ${nm(e.target)} <span class="dmg">-${e.dmg}</span>（剩 ${e.hp}）`; break;
      case 'bullet_end':
        if (e.reason === 'wall') html = `${nm(e.who)} 的子弹被墙挡下`;
        else if (e.reason === 'mound') html = `${nm(e.who)} 的子弹打在土堆上`;
        else if (e.reason === 'out') html = `${nm(e.who)} 的子弹飞出场外`;
        break;
      case 'mound_hit':
        if (e.hp > 0) html = `(${e.x},${e.y}) 的土堆被打出裂缝`;
        break;
      case 'mound_destroyed': html = `(${e.x},${e.y}) 的土堆<span class="dmg">被摧毁</span>`; break;
      case 'bomb_place': html = `${nm(e.who)} 在 (${e.x},${e.y}) 放下<span class="sk">炸弹</span>`; break;
      case 'bomb_explode': {
        const hits = (e.hits || []).map((h) => `${nm(h.who)} <span class="dmg">-${h.dmg}</span>`).join('、');
        html = `(${e.x},${e.y}) <span class="dmg">炸弹爆炸</span>（波及 ${e.cells.length} 格${hits ? '，' + hits : ''}）`;
        break;
      }
      case 'shield_block': html = `${nm(e.who)} 的<span class="sk">护盾</span>挡下了${e.source === 'bomb' ? '炸弹' : '子弹'}`; break;
      case 'freeze_hit': html = `${nm(e.target)} 被<span class="sk">冰冻</span> ${e.duration} 拍`; break;
      case 'poison_hit': html = `${nm(e.target)} <span class="sk">中毒</span>，${e.duration} 拍内持续掉血`; break;
      case 'star':
        held[e.who] = e.total;
        html = `${nm(e.who)} <span class="st">吃星 ★ ${held[0]}:${held[1]}</span>`;
        break;
      case 'star_spawn': html = `<span class="st">新星星</span>出现在 (${e.x},${e.y})`; break;
      case 'skill': html = `${nm(e.who)} 施放<span class="sk">${SKILL_CN[e.name] ?? e.name}</span>`; break;
      case 'stun_hit': html = `${nm(e.target)} 被<span class="sk">眩晕</span> ${e.duration} 拍`; break;
      case 'death': html = `${nm(e.who)} <span class="dmg">被击毁</span>`; break;
      case 'end':
        html = e.winner == null
          ? `平局（星 ${e.stars[0]}:${e.stars[1]}）`
          : `${nm(e.winner)} <span class="win2">获胜</span>（${e.reason === 'kill' ? '击杀' : '星数'}，星 ${e.stars[0]}:${e.stars[1]}）`;
        break;
      default: break;
    }
    if (html) out.push({ t: e.t, html });
  }
  return out;
}

// ---------- canvas 绘制（画法参照效果稿） ----------
function setupCanvas(map) {
  canvasEl.width = map.width * TSZ;
  canvasEl.height = map.height * TSZ;
}

// 每格确定性伪随机（纹理抖动用，与引擎 RNG 无关）
function tileHash(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + s * 1274126177) >>> 0;
  h = ((h ^ (h >>> 13)) * 1103515245) >>> 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function starPath(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5;
    const k = i % 2 ? r * 0.48 : r;
    ctx[i ? 'lineTo' : 'moveTo'](cx + k * Math.cos(a), cy + k * Math.sin(a));
  }
  ctx.closePath();
}

function drawStarShape(cx, cy, r, col) {
  // 参照原作素材：描边金星 + 内部高光
  starPath(cx, cy, r);
  ctx.fillStyle = col || '#FFC93C';
  ctx.fill();
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(2, r * 0.22);
  ctx.strokeStyle = '#7A4E12';
  ctx.stroke();
  starPath(cx, cy - r * 0.08, r * 0.52);
  ctx.fillStyle = '#FFE38F';
  ctx.fill();
}

function drawTank(px, py, ang, col, dark, alpha) {
  const k = TSZ / 32;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(px, py);
  ctx.rotate(ang);
  ctx.lineJoin = 'round';
  const ink = 'rgba(24,20,12,0.75)'; // 卡通描边
  // 履带（上下两条 + 纹路）
  ctx.fillStyle = dark;
  rrect(-14 * k, -13 * k, 28 * k, 8 * k, 3 * k); ctx.fill();
  rrect(-14 * k, 5 * k, 28 * k, 8 * k, 3 * k); ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.6 * k;
  rrect(-14 * k, -13 * k, 28 * k, 8 * k, 3 * k); ctx.stroke();
  rrect(-14 * k, 5 * k, 28 * k, 8 * k, 3 * k); ctx.stroke();
  ctx.lineWidth = 1.1 * k;
  ctx.strokeStyle = 'rgba(0,0,0,0.30)';
  for (let i = -10; i <= 10; i += 5) {
    ctx.beginPath(); ctx.moveTo(i * k, -12 * k); ctx.lineTo(i * k, -6 * k); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i * k, 6 * k); ctx.lineTo(i * k, 12 * k); ctx.stroke();
  }
  // 车身
  ctx.fillStyle = col;
  rrect(-11 * k, -8 * k, 22 * k, 16 * k, 3 * k); ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.8 * k;
  rrect(-11 * k, -8 * k, 22 * k, 16 * k, 3 * k); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; // 车身高光
  rrect(-9 * k, -6.5 * k, 18 * k, 4 * k, 2 * k); ctx.fill();
  // 炮管 + 炮口
  ctx.fillStyle = dark;
  ctx.fillRect(4 * k, -2.2 * k, 15 * k, 4.4 * k);
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.4 * k;
  ctx.strokeRect(4 * k, -2.2 * k, 15 * k, 4.4 * k);
  ctx.fillRect(18 * k, -3.4 * k, 3.6 * k, 6.8 * k);
  ctx.strokeRect(18 * k, -3.4 * k, 3.6 * k, 6.8 * k);
  // 炮塔
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(0, 0, 6.4 * k, 0, 7); ctx.fill();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 1.8 * k;
  ctx.beginPath(); ctx.arc(0, 0, 6.4 * k, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.arc(-1.8 * k, -1.8 * k, 2.4 * k, 0, 7); ctx.fill();
  ctx.restore();
}

function drawHpBar(px, py, pct, col) {
  const k = TSZ / 32;
  ctx.fillStyle = 'rgba(40,30,14,0.55)';
  ctx.fillRect(px - 18 * k, py - 28 * k, 36 * k, 6 * k);
  ctx.strokeStyle = 'rgba(24,20,12,0.75)';
  ctx.strokeRect(px - 18 * k, py - 28 * k, 36 * k, 6 * k);
  ctx.fillStyle = col;
  ctx.fillRect(px - 17 * k, py - 27 * k, 34 * k * Math.max(0, pct), 4 * k);
}

function drawWallTile(x, y) {
  // 鹅卵石砖（参照原作深蓝灰石墙）
  const px = x * TSZ;
  const py = y * TSZ;
  ctx.fillStyle = '#242C39'; // 石缝
  ctx.fillRect(px, py, TSZ, TSZ);
  for (let i = 0; i < 4; i++) {
    const sx = px + (i % 2) * (TSZ / 2);
    const sy = py + ((i / 2) | 0) * (TSZ / 2);
    const v = tileHash(x * 4 + i, y * 4 + i * 3, 7);
    const g = 58 + Math.floor(v * 20);
    const j = v * 2.2; // 石块大小抖动
    ctx.fillStyle = `rgb(${g},${g + 9},${g + 22})`;
    rrect(sx + 1.5 + j * 0.4, sy + 1.5 + j * 0.3, TSZ / 2 - 3 - j * 0.7, TSZ / 2 - 3 - j * 0.5, TSZ * 0.13);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.10)'; // 石面高光
    rrect(sx + 3.5, sy + 3, TSZ / 2 - 9, TSZ * 0.1, TSZ * 0.05);
    ctx.fill();
  }
  ctx.strokeStyle = '#161C25';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(px + 0.75, py + 0.75, TSZ - 1.5, TSZ - 1.5);
}

function drawDirtTile(x, y) {
  // 棕色土堆（圆润山包 + 深描边 + 受光面）
  const cx = x * TSZ + TSZ / 2;
  const cy = y * TSZ + TSZ / 2;
  const r = TSZ * 0.44;
  ctx.fillStyle = 'rgba(60,40,15,0.20)'; // 投影
  ctx.beginPath(); ctx.ellipse(cx, cy + r * 0.62, r * 0.95, r * 0.34, 0, 0, 7); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.98, cy + r * 0.62);
  ctx.quadraticCurveTo(cx - r * 0.92, cy - r * 0.32, cx - r * 0.34, cy - r * 0.72);
  ctx.quadraticCurveTo(cx + r * 0.02, cy - r * 1.02, cx + r * 0.42, cy - r * 0.66);
  ctx.quadraticCurveTo(cx + r * 0.96, cy - r * 0.26, cx + r * 0.98, cy + r * 0.62);
  ctx.closePath();
  ctx.fillStyle = '#9A6B33';
  ctx.fill();
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(2, TSZ * 0.08);
  ctx.strokeStyle = '#432B12';
  ctx.stroke();
  ctx.beginPath(); // 受光亮面
  ctx.moveTo(cx - r * 0.52, cy + r * 0.4);
  ctx.quadraticCurveTo(cx - r * 0.5, cy - r * 0.34, cx - r * 0.08, cy - r * 0.6);
  ctx.quadraticCurveTo(cx + r * 0.12, cy - r * 0.24, cx - r * 0.04, cy + r * 0.4);
  ctx.closePath();
  ctx.fillStyle = '#B8894B';
  ctx.fill();
  ctx.fillStyle = 'rgba(67,43,18,0.55)'; // 碎石点
  for (let i = 0; i < 3; i++) {
    const v = tileHash(x * 8 + i, y * 8 + i, 11);
    ctx.beginPath();
    ctx.arc(cx - r * 0.4 + v * r * 0.9, cy + r * (0.05 + 0.3 * v), TSZ * 0.045, 0, 7);
    ctx.fill();
  }
}

function drawGrassTile(x, y) {
  // 卡通草丛（扇形叶片、双色，长在沙地上）
  const cx = x * TSZ + TSZ / 2;
  const base = y * TSZ + TSZ * 0.78;
  const r = TSZ * 0.42;
  ctx.fillStyle = 'rgba(74,110,45,0.22)'; // 根部阴影
  ctx.beginPath(); ctx.ellipse(cx, base, r * 0.82, r * 0.24, 0, 0, 7); ctx.fill();
  const blades = 9;
  for (let i = 0; i < blades; i++) {
    const v = tileHash(x * 16 + i, y * 16 + i, 13);
    const spread = i - (blades - 1) / 2;
    const a = -Math.PI / 2 + spread * 0.26 + (v - 0.5) * 0.18;
    const len = r * (0.95 + v * 0.6);
    const bx = cx + spread * TSZ * 0.065;
    const mx = bx + Math.cos(a) * len * 0.55;
    const my = base + Math.sin(a) * len * 0.62;
    ctx.beginPath();
    ctx.moveTo(bx - TSZ * 0.085, base);
    ctx.quadraticCurveTo(mx - TSZ * 0.04, my, bx + Math.cos(a) * len, base + Math.sin(a) * len);
    ctx.quadraticCurveTo(mx + TSZ * 0.04, my, bx + TSZ * 0.085, base);
    ctx.closePath();
    ctx.fillStyle = i % 2 ? '#3C9440' : '#74C868';
    ctx.fill();
  }
}

function drawArena(map, f, names, shots, sparks, curT) {
  const W = map.width;
  const H = map.height;
  // 沙地底（参照原作：土黄地面 + 淡纹理 + 木板横线）
  ctx.fillStyle = '#C9B274';
  ctx.fillRect(0, 0, W * TSZ, H * TSZ);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const v = tileHash(x, y, 1);
      if (v > 0.5) {
        ctx.fillStyle = `rgba(120,90,40,${(v - 0.5) * 0.14})`;
        ctx.fillRect(x * TSZ, y * TSZ, TSZ, TSZ);
      }
      if (v < 0.18) { // 沙面杂点
        ctx.fillStyle = 'rgba(100,75,30,0.18)';
        ctx.fillRect(x * TSZ + (v * 90) % TSZ, y * TSZ + (v * 53) % TSZ, 2, 2);
      }
    }
  }
  ctx.lineWidth = 1;
  for (let y = 0; y <= H; y++) {
    ctx.strokeStyle = y % 2 ? 'rgba(110,82,35,0.20)' : 'rgba(110,82,35,0.10)';
    ctx.beginPath(); ctx.moveTo(0, y * TSZ); ctx.lineTo(W * TSZ, y * TSZ); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(110,82,35,0.08)';
  for (let x = 0; x <= W; x++) { ctx.beginPath(); ctx.moveTo(x * TSZ, 0); ctx.lineTo(x * TSZ, H * TSZ); ctx.stroke(); }
  // 地形
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const tile = map.tiles[y][x];
      if (tile === TILE.GRASS) drawGrassTile(x, y);
      else if (tile === TILE.WALL) drawWallTile(x, y);
      else if (tile === TILE.DIRT) {
        if (f.gone && f.gone.has(`${x},${y}`)) continue; // 已被摧毁：露出地面
        drawDirtTile(x, y);
        if (f.cracked && f.cracked.has(`${x},${y}`)) { // 打裂：加裂缝
          const cx = x * TSZ + TSZ / 2;
          const cy = y * TSZ + TSZ / 2;
          ctx.strokeStyle = 'rgba(30,18,6,0.85)';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(cx - TSZ * 0.18, cy - TSZ * 0.24);
          ctx.lineTo(cx - TSZ * 0.02, cy - TSZ * 0.02);
          ctx.lineTo(cx - TSZ * 0.12, cy + TSZ * 0.2);
          ctx.moveTo(cx - TSZ * 0.02, cy - TSZ * 0.02);
          ctx.lineTo(cx + TSZ * 0.2, cy + TSZ * 0.06);
          ctx.stroke();
        }
      }
    }
  }
  // 炸弹（黑色圆雷 + 引信倒数，对双方可见）
  if (f.bombs) {
    for (const b of f.bombs) {
      const px = b.x * TSZ + TSZ / 2;
      const py = b.y * TSZ + TSZ / 2;
      ctx.fillStyle = '#1F2937';
      ctx.beginPath(); ctx.arc(px, py + 1.5, TSZ * 0.27, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(24,20,12,0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py + 1.5, TSZ * 0.27, 0, 7); ctx.stroke();
      ctx.strokeStyle = '#8B5A2B';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px + 2, py - TSZ * 0.2); ctx.quadraticCurveTo(px + 6, py - TSZ * 0.42, px + 10, py - TSZ * 0.34); ctx.stroke();
      const left = Math.max(0, RULES.bombFuse - (curT - b.t0));
      ctx.fillStyle = '#FFE38F';
      ctx.font = `bold ${Math.round(TSZ * 0.34)}px Menlo, monospace`;
      ctx.fillText(String(left), px - TSZ * 0.1, py + TSZ * 0.14);
    }
  }
  // 星星
  for (const s of f.field) drawStarShape(s.x * TSZ + TSZ / 2, s.y * TSZ + TSZ / 2, TSZ * 0.34, COLOR.star);
  // 弹道（逐 tick 插值飞行：出膛→终点按 2 格/tick 推进，终结后拖尾渐隐 2 拍）
  if (shots) {
    for (const s of shots) {
      if (curT < s.t0 || curT > s.t1 + 2) continue;
      const dur = Math.max(1, s.t1 - s.t0);
      const prog = Math.min(1, (curT - s.t0) / dur);
      const bx = s.x0 + (s.x1 - s.x0) * prog;
      const by = s.y0 + (s.y1 - s.y0) * prog;
      const a = curT <= s.t1 ? 0.7 : 0.7 * (1 - (curT - s.t1) / 3);
      ctx.strokeStyle = s.who === 0 ? `rgba(63,98,30,${a})` : `rgba(140,42,85,${a})`;
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(s.x0 * TSZ + TSZ / 2, s.y0 * TSZ + TSZ / 2);
      ctx.lineTo(bx * TSZ + TSZ / 2, by * TSZ + TSZ / 2);
      ctx.stroke();
      ctx.setLineDash([]);
      if (curT <= s.t1) { // 在飞弹丸本体
        ctx.fillStyle = 'rgba(40,30,14,0.95)';
        ctx.beginPath(); ctx.arc(bx * TSZ + TSZ / 2, by * TSZ + TSZ / 2, 3.2, 0, 7); ctx.fill();
      }
    }
  }
  // 坦克
  for (const i of [0, 1]) {
    const p = f.pos[i];
    const px = p.x * TSZ + TSZ / 2;
    const py = p.y * TSZ + TSZ / 2;
    const col = i === 0 ? COLOR.p1 : COLOR.p2;
    const dark = i === 0 ? COLOR.p1d : COLOR.p2d;
    if (f.dead[i]) {
      drawTank(px, py, f.facing[i], '#4B5563', '#293241', 0.35);
      ctx.strokeStyle = 'rgba(248,113,113,0.9)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(px - 9, py - 9); ctx.lineTo(px + 9, py + 9);
      ctx.moveTo(px + 9, py - 9); ctx.lineTo(px - 9, py + 9);
      ctx.stroke();
      continue;
    }
    const cloaked = f.cloak[i] > 0;
    const inGrass = map.tiles[p.y][p.x] === TILE.GRASS;
    const alpha = cloaked ? 0.4 : inGrass ? 0.72 : 1;
    drawTank(px, py, f.facing[i], col, dark, alpha);
    if (cloaked) { // 隐身虚线圈
      ctx.strokeStyle = 'rgba(56,189,248,0.6)';
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(px, py, TSZ * 0.62, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (f.stun[i] > 0) { // 眩晕黄圈
      ctx.strokeStyle = 'rgba(251,191,36,0.85)';
      ctx.setLineDash([3, 4]);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, TSZ * 0.68, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (f.frozen && f.frozen[i] > 0) { // 冰冻蓝圈
      ctx.strokeStyle = 'rgba(96,165,250,0.9)';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(px, py, TSZ * 0.62, 0, 7); ctx.stroke();
    }
    if (f.shield && f.shield[i]) { // 护盾金圈
      ctx.strokeStyle = 'rgba(255,201,60,0.9)';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(px, py, TSZ * 0.74, 0, 7); ctx.stroke();
    }
    if (f.poison && f.poison[i] > 0) { // 中毒绿泡
      ctx.fillStyle = 'rgba(74,222,128,0.9)';
      ctx.beginPath(); ctx.arc(px + TSZ * 0.34, py - TSZ * 0.42, 3.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(px + TSZ * 0.18, py - TSZ * 0.55, 2.2, 0, 7); ctx.fill();
    }
    drawHpBar(px, py, f.hp[i] / RULES.hp, f.hp[i] <= 30 ? '#E05252' : '#3FA34D');
    // 名牌药丸（参照原作红/蓝名牌徽章）
    ctx.font = 'bold 10px "PingFang SC", Menlo, sans-serif';
    const tag = `P${i + 1} ${names[i]}${cloaked ? ' 隐身中…' : ''} ★${f.held[i]}`;
    const tw = ctx.measureText(tag).width + 12;
    const bx = Math.min(Math.max(px - tw / 2, 2), map.width * TSZ - tw - 2);
    const by = py + TSZ * 0.68;
    ctx.fillStyle = i === 0 ? 'rgba(61,94,30,0.92)' : 'rgba(140,42,85,0.92)';
    rrect(bx, by, tw, 14, 7);
    ctx.fill();
    ctx.fillStyle = '#FFF8E7';
    ctx.fillText(tag, bx + 6, by + 10.5);
  }
  // 火花（命中/传送）
  if (sparks) {
    for (const sp of sparks) {
      const age = curT - sp.t;
      if (age < 0 || age > 2) continue;
      const px = sp.x * TSZ + TSZ / 2;
      const py = sp.y * TSZ + TSZ / 2;
      const a = 0.9 * (1 - age / 3);
      if (sp.kind === 'hit') {
        ctx.fillStyle = `rgba(251,191,36,${a})`;
        ctx.beginPath(); ctx.arc(px, py, 5, 0, 7); ctx.fill();
        ctx.strokeStyle = `rgba(251,191,36,${a * 0.7})`;
        ctx.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const ang = (i * Math.PI) / 3;
          ctx.beginPath();
          ctx.moveTo(px + 7 * Math.cos(ang), py + 7 * Math.sin(ang));
          ctx.lineTo(px + 13 * Math.cos(ang), py + 13 * Math.sin(ang));
          ctx.stroke();
        }
      } else if (sp.kind === 'boom') { // 炸弹爆炸格闪光
        ctx.fillStyle = `rgba(249,115,22,${a * 0.75})`;
        rrect(sp.x * TSZ + 2.5, sp.y * TSZ + 2.5, TSZ - 5, TSZ - 5, 6);
        ctx.fill();
        ctx.strokeStyle = `rgba(255,201,60,${a})`;
        ctx.lineWidth = 2;
        rrect(sp.x * TSZ + 2.5, sp.y * TSZ + 2.5, TSZ - 5, TSZ - 5, 6);
        ctx.stroke();
      } else if (sp.kind === 'shield') { // 护盾格挡闪光
        ctx.strokeStyle = `rgba(255,201,60,${a})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(px, py, TSZ * 0.7 + age * 3, 0, 7); ctx.stroke();
      } else { // teleport 闪光
        ctx.strokeStyle = `rgba(56,189,248,${a})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(px, py, TSZ * 0.5 + age * 4, 0, 7); ctx.stroke();
      }
    }
  }
}

// ---------- 对局状态 & 回放 ----------
let match = null; // { seedStr, seed, map, result, names, frames, shots, sparks, entries }
let cur = 0;
let playing = false;
let speedIdx = 1; // 默认 2x
let logRows = [];
let litCount = -1;
let previewMap = null;

function setPlaying(p) {
  playing = p;
  playBtn.textContent = p ? '⏸' : '▶';
}

function renderLogList() {
  logEl.innerHTML = '';
  logRows = [];
  litCount = -1;
  for (const en of match.entries) {
    const d = document.createElement('div');
    d.className = 'ln';
    d.innerHTML = `<span class="t mono">t=${String(en.t).padStart(3, '0')}</span>${en.html}`;
    logEl.appendChild(d);
    logRows.push({ t: en.t, el: d });
  }
}

function lightLog() {
  if (!match) return;
  let n = 0;
  while (n < logRows.length && logRows[n].t <= cur) n++;
  if (n === litCount) return;
  for (let k = 0; k < logRows.length; k++) logRows[k].el.classList.toggle('on', k < n);
  litCount = n;
  if (n > 0) {
    const el = logRows[n - 1].el;
    logEl.scrollTop = Math.max(0, el.offsetTop - logEl.clientHeight + el.offsetHeight + 8 - logEl.offsetTop);
  }
}

function updateTrack() {
  const total = match ? match.result.ticks - 1 : 0;
  const pct = total > 0 ? cur / total : 0;
  trackFill.style.width = `${pct * 100}%`;
  trackKnob.style.left = `${pct * 100}%`;
  tickLabel.textContent = match ? `t=${cur} / ${total}` : 't=— / —';
}

function render() {
  if (match) {
    const f = match.frames[Math.min(cur, match.frames.length - 1)];
    drawArena(match.map, f, match.names, match.shots, match.sparks, cur);
    updateTrack();
    lightLog();
  } else if (previewMap) {
    drawArena(previewMap, {
      pos: previewMap.spawns.map((s) => ({ ...s })),
      hp: [RULES.hp, RULES.hp], held: [0, 0], cloak: [0, 0], stun: [0, 0],
      frozen: [0, 0], poison: [0, 0], shield: [false, false],
      facing: [0, Math.PI], dead: [false, false],
      field: previewMap.stars.slice(0, RULES.maxFieldStars ?? previewMap.stars.length),
      bombs: [], gone: new Set(), cracked: new Set(),
    }, ['我的坦克 v' + curVersion, '对手'], null, null, 0);
  }
}

let lastTs = 0;
let acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (ts - lastTs) / 1000 || 0);
  lastTs = ts;
  if (playing && match) {
    acc += dt * BASE_TPS * SPEEDS[speedIdx];
    const n = Math.floor(acc);
    if (n > 0) {
      acc -= n;
      cur = Math.min(cur + n, match.result.ticks - 1);
      if (cur >= match.result.ticks - 1) setPlaying(false);
    }
  }
  render();
}

function updateVerdict(box) {
  const r = match.result;
  const names = match.names;
  if (r.winner === null) {
    verdictMain.textContent = '◐ 平局';
    verdictMain.style.color = 'var(--muted)';
  } else {
    verdictMain.textContent = `● ${names[r.winner]} WIN`;
    verdictMain.style.color = r.winner === 0 ? 'var(--p1)' : 'var(--p2)';
  }
  const how = r.reason === 'kill' ? '击杀' : r.reason === 'stars' ? '星数' : '平局';
  verdictSub.textContent = `${how} @ t=${r.ticks - 1} · 星 ${r.stars[0]}:${r.stars[1]} · 用时 ${(r.ticks / BASE_TPS).toFixed(1)}s`;
  verdictRef.textContent = `回放 · 战报 #${10000 + (match.seed % 90000)}`;
  if (box && box.count > 0) showErr(`脚本运行时报错 ${box.count} 次（该拍已按待机处理）：${box.last}`);
}

function updateFooter() {
  footSeed.textContent = `deterministic · seed=${match.seedStr}`;
  const bytes = new TextEncoder().encode(renderText(match.result, match.names).join('\n')).length;
  footLog.textContent = `battle.log ${(bytes / 1024).toFixed(1)}KB`;
}

function startBattle() {
  hideErr();
  let fn;
  try {
    fn = compileScript(editorEl.value);
  } catch (e) {
    showErr(`脚本编译失败：${String((e && e.message) || e)}`);
    return;
  }
  const box = { count: 0, last: '' };
  const guarded = guardWrap(fn, box);
  guarded.skill = userSkill(); // 8 选 1：显式挂到脚本函数上（runMatch 按 .skill 取装备）
  const seedStr = seedInput.value.trim() || '1';
  const seed = seedFromString(seedStr);
  const oppKey = oppSelect.value;
  const opp = ROSTER.find((r) => r.key === oppKey) || ROSTER[0];
  // 地图与对局同源：预置图按选择取，随机图与 seed 同源；先取图再喂给 runMatch，保证渲染的就是对局用图
  const map = makeMap(seed);
  const names = [`我的坦克 v${curVersion}`, `${opp.style}流`];
  const result = runMatch({ seed, botA: guarded, botB: opp.fn, map });
  const tl = buildTimeline(map, result);
  match = { seedStr, seed, map, result, names, frames: tl.frames, shots: tl.shots, sparks: tl.sparks, entries: buildLog(result, names) };
  setupCanvas(map);
  renderLogList();
  updateVerdict(box);
  updateFooter();
  cur = 0;
  acc = 0;
  setPlaying(true);
}

// ---------- 天梯（空闲时固定 seeds 循环赛实算 ELO/胜率） ----------
let ladderToken = 0;
function computeLadder() {
  const token = ++ladderToken;
  const parts = ROSTER.map((r) => ({ ...r, elo: 1200, w: 0, d: 0, g: 0 }));
  try {
    const fn = compileScript(editorEl.value);
    const box = { count: 0, last: '' };
    const gfn = guardWrap(fn, box);
    gfn.skill = userSkill();
    parts.push({ key: '__user__', tank: `我的坦克 v${curVersion}`, style: '自定义', fn: gfn, me: true, elo: 1200, w: 0, d: 0, g: 0 });
  } catch { /* 用户脚本编译失败：天梯只算内置四家 */ }
  const jobs = [];
  for (let i = 0; i < parts.length; i++) for (let j = i + 1; j < parts.length; j++) jobs.push([i, j]);
  let k = 0;
  const step = () => {
    if (token !== ladderToken) return; // 有新一轮计算，废弃本轮
    if (k >= jobs.length) { renderLadder(parts); return; }
    const [i, j] = jobs[k++];
    for (const seed of LADDER_SEEDS) {
      for (const flip of [false, true]) {
        const A = flip ? parts[j] : parts[i];
        const B = flip ? parts[i] : parts[j];
        const r = runMatch({ seed, botA: A.fn, botB: B.fn });
        const sA = r.winner === null ? 0.5 : r.winner === 0 ? 1 : 0;
        const ea = 1 / (1 + 10 ** ((B.elo - A.elo) / 400));
        A.elo += 24 * (sA - ea);
        B.elo += 24 * ((1 - sA) - (1 - ea));
        A.g++; B.g++;
        if (sA === 1) A.w++;
        else if (sA === 0) B.w++;
        else { A.d++; B.d++; }
      }
    }
    setTimeout(step, 0); // 分片跑，不卡首屏
  };
  step();
}

function renderLadder(parts) {
  parts.sort((a, b) => b.elo - a.elo);
  ladderBody.innerHTML = '';
  parts.forEach((p, i) => {
    const tr = document.createElement('tr');
    if (p.me) tr.className = 'me';
    const wr = p.g ? Math.round(((p.w + 0.5 * p.d) / p.g) * 100) : 0;
    tr.innerHTML = `<td${i === 0 ? ' class="r1"' : ''}>${i + 1}</td><td>${p.tank}</td><td>${p.style}</td><td class="elo">${Math.round(p.elo)}</td><td>${wr}%</td>`;
    ladderBody.appendChild(tr);
  });
  for (const r of ROSTER) {
    const p = parts.find((x) => x.key === r.key);
    const opt = oppSelect.querySelector(`option[value="${r.key}"]`);
    if (p && opt) opt.textContent = `${r.style}流 (内置 · 技能：${SKILL_CN[r.fn.skill] ?? r.fn.skill} · ELO ${Math.round(p.elo)})`;
  }
  const mine = parts.find((p) => p.me);
  rankChip.textContent = mine
    ? `★ 我的坦克 v${curVersion} · ELO ${Math.round(mine.elo)}（#${parts.indexOf(mine) + 1}/${parts.length}）`
    : '★ 天梯已更新';
  const hint = document.getElementById('ladderHint');
  if (hint) hint.textContent = `固定 seeds ${JSON.stringify(LADDER_SEEDS)} 双边循环赛 · 共 ${parts.length * (parts.length - 1) * LADDER_SEEDS.length} 局实算`;
}

function scheduleLadder() {
  const go = () => computeLadder();
  if (typeof requestIdleCallback === 'function') requestIdleCallback(go, { timeout: 1200 });
  else setTimeout(go, 600);
}

// ---------- 事件绑定 ----------
$id('battleBtn').addEventListener('click', startBattle);
saveBtn.addEventListener('click', saveVersion);
if (skillSel) skillSel.addEventListener('change', scheduleLadder);
if (mapSel) mapSel.addEventListener('change', () => {
  // 切图立即生效：回到预览态，下一局按新图开战
  match = null;
  setPlaying(false);
  cur = 0;
  acc = 0;
  previewMap = makeMap(seedFromString(seedInput.value.trim() || '1'));
  setupCanvas(previewMap);
});
playBtn.addEventListener('click', () => { if (match) setPlaying(!playing); });
$id('firstBtn').addEventListener('click', () => { if (match) { cur = 0; acc = 0; } });
$id('lastBtn').addEventListener('click', () => { if (match) { cur = match.result.ticks - 1; setPlaying(false); } });
$id('speedBox').addEventListener('click', (e) => {
  const s = e.target && e.target.dataset ? e.target.dataset.s : null;
  if (s == null) return;
  speedIdx = Number(s);
  for (const el of e.currentTarget.children) el.classList.toggle('on', el.dataset.s === s);
});
let dragging = false;
function seekFromPointer(e) {
  if (!match) return;
  const r = trackEl.getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  cur = Math.round(pct * (match.result.ticks - 1));
}
trackEl.addEventListener('pointerdown', (e) => { dragging = true; trackEl.setPointerCapture(e.pointerId); seekFromPointer(e); });
trackEl.addEventListener('pointermove', (e) => { if (dragging) seekFromPointer(e); });
trackEl.addEventListener('pointerup', () => { dragging = false; });

// ---------- 启动 ----------
loadStore();
if (!editorEl.value.trim()) editorEl.value = DEFAULT_SCRIPT;
if (!EVAL_OK) {
  const note = document.createElement('div');
  note.style.cssText = 'margin:6px 12px 0;padding:6px 8px;font-size:11px;line-height:1.5;color:#8b949e;border:1px solid #30363d;border-radius:6px;';
  note.textContent = '线上托管版：宿主 CSP 禁 eval，默认脚本以内置等价策略运行；编辑自定义脚本请把本页另存为 .html 在本地打开。';
  errEl.parentNode.insertBefore(note, errEl);
}
updateVersionUi();
const qp = new URLSearchParams(location.search);
if (qp.get('seed')) seedInput.value = qp.get('seed');
if (qp.get('map') && mapSel && [...mapSel.options].some((o) => o.value === qp.get('map'))) {
  mapSel.value = qp.get('map'); // ?map=id 直达预置图（可分享/截图复现）
}
footSeed.textContent = `deterministic · seed=${seedInput.value.trim()}`;
previewMap = makeMap(seedFromString(seedInput.value));
setupCanvas(previewMap);
requestAnimationFrame(loop);
scheduleLadder();
if (qp.get('autoplay') === '1') {
  startBattle();
  if (match) { // 跳到中局并停住，便于截图/演示（双方坦克在场、战报点亮过半）
    cur = Math.floor((match.result.ticks - 1) / 2);
    setPlaying(false);
  }
}
})();
</script>
</body>
</html>
