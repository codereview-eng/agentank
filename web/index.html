<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgenTank — AI 脚本坦克对战</title>
<style>
:root{
  --bg:#10151D; --panel:#1A212C; --panel-2:#151B25; --line:#2A3442;
  --text:#E6ECF3; --muted:#8B9AAD; --dim:#5C6B7E;
  --p1:#A3E635; --p2:#F472B6; --star:#FBBF24;
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --accent:#38BDF8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.6 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}
code,pre,.mono,textarea{font-family:ui-monospace,"SF Mono",Menlo,monospace}

/* ── 顶栏 ── */
header{
  display:flex; align-items:center; gap:16px; padding:10px 20px;
  background:var(--panel-2); border-bottom:1px solid var(--line);
}
.logo{font-weight:800; font-size:18px; letter-spacing:1px}
.logo b{color:var(--p1)}
.logo span{color:var(--muted); font-weight:400; font-size:12px; margin-left:10px}
.badge{margin-left:auto; display:flex; gap:10px; align-items:center; font-size:12px}
.chip{border:1px solid var(--line); border-radius:999px; padding:2px 12px; color:var(--muted)}
.chip.rank{color:var(--star); border-color:#54431C}

/* ── 三栏 ── */
main{flex:1; display:grid; grid-template-columns:340px 1fr 300px; gap:12px; padding:12px 16px; min-height:0}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; min-height:0}
.panel h2{
  font-size:12px; color:var(--muted); font-weight:600; letter-spacing:2px;
  padding:10px 14px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px;
}
.panel h2 .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* 左：脚本编辑器 */
#editor{
  flex:1; padding:12px 14px; border:none; outline:none; resize:none;
  background:transparent; color:#C9D6E4; font-size:12.5px; line-height:1.7;
  white-space:pre; overflow:auto; tab-size:2;
}
.err{display:none; color:var(--bad); font-size:12px; padding:8px 14px; border-top:1px solid var(--line); background:#2A1518; white-space:pre-wrap}
.err.show{display:block}
.ctrl{padding:12px 14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.row{display:flex; gap:8px; align-items:center}
select,input{
  background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  border-radius:6px; padding:6px 10px; font-size:13px; flex:1; min-width:0;
}
label{font-size:12px; color:var(--muted); width:64px; flex:none}
.btn{
  border:none; border-radius:8px; padding:10px 0; font-size:15px; font-weight:700;
  background:var(--p1); color:#1A2408; cursor:pointer; letter-spacing:4px;
}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--muted); font-weight:400; letter-spacing:1px; font-size:12px; padding:6px 0}

/* 中：竞技场 */
.arena-wrap{align-items:center; justify-content:flex-start}
.verdict{
  width:100%; padding:8px 14px; font-size:13px; display:flex; gap:14px; align-items:center;
  border-bottom:1px solid var(--line); min-height:38px;
}
.verdict .win{font-weight:700; color:var(--muted)}
.verdict .vs{color:var(--muted)}
.verdict .ref{margin-left:auto; color:var(--muted)}
.arena-scroll{flex:1; width:100%; display:flex; align-items:center; justify-content:center; min-height:0; overflow:auto}
canvas{border:1px solid var(--line); border-radius:6px; background:#0C1118; max-width:100%; max-height:100%}
.playbar{display:flex; gap:10px; align-items:center; padding:10px 18px 14px; width:100%}
.pb-btn{
  width:34px;height:30px; border:1px solid var(--line); border-radius:6px;
  background:var(--panel-2); color:var(--text); font-size:13px; cursor:pointer; flex:none;
}
.pb-btn.play{background:var(--accent); color:#062033; border:none; font-weight:700}
.track{flex:1; height:6px; border-radius:3px; background:var(--panel-2); position:relative; cursor:pointer}
.track i{position:absolute; left:0; top:0; height:100%; width:0; background:var(--accent); border-radius:3px; pointer-events:none}
.track b{position:absolute; left:0; top:-4px; width:14px; height:14px; border-radius:50%; background:var(--text); margin-left:-7px; pointer-events:none}
.tick{font-size:12px; color:var(--muted); white-space:nowrap}
.speed{display:flex; gap:4px}
.speed span{font-size:11px; padding:2px 8px; border:1px solid var(--line); border-radius:4px; color:var(--muted); cursor:pointer}
.speed .on{background:var(--panel-2); color:var(--text); border-color:var(--accent)}

/* 右：战报+天梯 */
.log{flex:1.2; overflow:auto; padding:10px 14px; font-size:12px; line-height:1.9; min-height:0}
.log .ln{opacity:.25; transition:opacity .15s}
.log .ln.on{opacity:1}
.log .t{color:var(--dim); margin-right:6px}
.log .p1{color:var(--p1)} .log .p2{color:var(--p2)}
.log .sk{color:var(--accent)} .log .st{color:var(--star)} .log .dmg{color:var(--bad)}
.log .win2{color:var(--ok); font-weight:700}
table{width:100%; border-collapse:collapse; font-size:12px}
th{color:var(--muted); font-weight:500; text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
td{padding:6px 8px; border-bottom:1px solid #1F2733; font-variant-numeric:tabular-nums}
td.r1{color:var(--star)} .elo{color:var(--accent)}
.me td{background:#1E2A1A}
.ladder-hint{padding:8px 14px; font-size:11px; color:var(--dim)}
footer{
  padding:6px 20px; border-top:1px solid var(--line); background:var(--panel-2);
  font-size:11px; color:var(--dim); display:flex; gap:24px;
}
footer .mono{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="logo"><b>AGEN</b>TANK <span>AI 脚本坦克对战 · 你当教练，AI 开炮</span></div>
  <div class="badge">
    <span class="chip rank" id="rankChip">★ ELO 计算中…</span>
    <span class="chip">赛季 S1</span>
    <span class="chip">v0.1.0</span>
  </div>
</header>
<main>
  <!-- 左：策略脚本 -->
  <section class="panel">
    <h2><span class="dot"></span><span id="editorTitle">策略脚本 · 我的坦克 v1</span></h2>
    <textarea id="editor" spellcheck="false"></textarea>
    <div class="err" id="scriptErr"></div>
    <div class="ctrl">
      <div class="row"><label>对手</label>
        <select id="opp">
          <option value="stealth">隐身偷袭流 (内置 · 技能：隐身)</option>
          <option value="starGrabber">抢星流 (内置 · 技能：疾驰)</option>
          <option value="camper">蹲草流 (内置 · 技能：冰冻)</option>
          <option value="brawler">贴脸流 (内置 · 技能：超载)</option>
        </select>
      </div>
      <div class="row"><label>我的技能</label>
        <select id="skillSel">
          <option value="teleport" selected>传送（8 选 1）</option>
          <option value="shield">护盾</option>
          <option value="freeze">冰冻</option>
          <option value="stun">眩晕</option>
          <option value="overload">超载</option>
          <option value="cloak">隐身</option>
          <option value="poison">剧毒</option>
          <option value="boost">疾驰</option>
        </select>
      </div>
      <div class="row"><label>地图</label>
        <select id="mapSel">
          <option value="random" selected>随机（按种子生成）</option>
        </select>
      </div>
      <div class="row"><label>种子</label><input class="mono" id="seed" value="20260805-42"></div>
      <button class="btn" id="battleBtn">开 战</button>
      <button class="btn ghost" id="saveBtn">保存为新版本（当前 v1 · 共 1 版）</button>
    </div>
  </section>

  <!-- 中：竞技场回放 -->
  <section class="panel arena-wrap">
    <div class="verdict">
      <span class="win" id="verdictMain">尚未开战</span>
      <span class="vs" id="verdictSub">编辑左侧脚本，点「开 战」开始对局</span>
      <span class="ref" id="verdictRef"></span>
    </div>
    <div class="arena-scroll"><canvas id="arena" width="476" height="476"></canvas></div>
    <div class="playbar">
      <button class="pb-btn" id="firstBtn" title="跳到开局">⏮</button>
      <button class="pb-btn play" id="playBtn">▶</button>
      <button class="pb-btn" id="lastBtn" title="跳到终局">⏭</button>
      <div class="track" id="track"><i id="trackFill"></i><b id="trackKnob"></b></div>
      <span class="tick mono" id="tickLabel">t=— / —</span>
      <div class="speed" id="speedBox"><span data-s="0">1x</span><span data-s="1" class="on">2x</span><span data-s="2">4x</span></div>
    </div>
  </section>

  <!-- 右：战报 + 天梯 -->
  <section class="panel">
    <h2><span class="dot"></span>实时战报</h2>
    <div class="log" id="log"><div class="ln on"><span class="t mono">t=000</span>等待开战…</div></div>
    <h2><span class="dot"></span>天梯 · 内置流派</h2>
    <table>
      <thead><tr><th>#</th><th>坦克</th><th>流派</th><th>ELO</th><th>胜率</th></tr></thead>
      <tbody id="ladderBody"><tr><td colspan="5" style="color:var(--dim)">空闲时计算循环赛中…</td></tr></tbody>
    </table>
    <div class="ladder-hint" id="ladderHint">固定 seeds 循环赛 · 页面空闲时实算</div>
  </section>
</main>
<footer>
  <span>引擎 <span class="mono" id="footSeed">deterministic · seed=20260805-42</span></span>
  <span>战报仅文字记录 <span class="mono" id="footLog">battle.log —</span>，回放由前端渲染</span>
  <span>沙箱 <span class="mono">new Function 编译 · 受限 API · 脚本报错=本拍待机</span></span>
</footer>
<script type="module" src="./app.js"></script>
</body>
</html>
